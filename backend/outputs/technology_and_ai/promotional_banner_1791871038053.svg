<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Autonomous AI Agent Swarms">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="promo-gen_is0xkfe-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#09090b" />
        <stop offset="100%" stop-color="#18181b" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="promo-gen_is0xkfe-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="100%" stop-color="#f43f5e" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="promo-gen_is0xkfe-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#18181b" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="promo-gen_is0xkfe-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="promo-gen_is0xkfe-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="promo-gen_is0xkfe-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#06b6d4" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#promo-gen_is0xkfe-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#promo-gen_is0xkfe-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#06b6d4" filter="url(#promo-gen_is0xkfe-glow)" />
      <circle cx="60" cy="567" r="240" fill="#f43f5e" filter="url(#promo-gen_is0xkfe-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#27272a" stroke-width="1" />
  

  <!-- Left Content Column -->
  <g transform="translate(80, 100)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="248" height="32" rx="16" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
    <text x="16" y="21" fill="#06b6d4" font-size="13" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      TECHNOLOGY AND AI • 2026
    </text>

    <!-- Main Headline -->
    
    <text x="0" y="75" fill="#fafafa" font-size="48" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Autonomous AI Agent</tspan><tspan x="0" dy="56">Swarms</tspan>
    </text>
  

    <!-- Subtitle / Body Copy -->
    
    <text x="0" y="200" fill="#a1a1aa" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Comprehensive visual breakdown and tactical</tspan><tspan x="0" dy="28">implementation guide for autonomous ai agent</tspan><tspan x="0" dy="28">swarms.</tspan>
    </text>
  

    <!-- CTA Button -->
    <g transform="translate(0, 300)" filter="url(#promo-gen_is0xkfe-shadow)">
      <rect x="0" y="0" width="220" height="52" rx="26" fill="url(#promo-gen_is0xkfe-primary-grad)" />
      <text x="95" y="32" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
        Discover Solutions
      </text>
      
    <g transform="translate(165, 16)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <line x1="5" x2="19" y1="12" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  
      </svg>
    </g>
  
    </g>
  </g>

  <!-- Right Visual / Feature Cards Bento -->
