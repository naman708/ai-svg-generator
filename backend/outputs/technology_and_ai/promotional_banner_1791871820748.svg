<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Autonomous AI Agent Swarms">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="promo-12lrv-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#09090b" />
        <stop offset="100%" stop-color="#18181b" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="promo-12lrv-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="100%" stop-color="#f43f5e" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="promo-12lrv-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#18181b" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="promo-12lrv-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="promo-12lrv-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="promo-12lrv-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#06b6d4" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#promo-12lrv-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#promo-12lrv-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#06b6d4" filter="url(#promo-12lrv-glow)" />
      <circle cx="60" cy="567" r="240" fill="#f43f5e" filter="url(#promo-12lrv-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#27272a" stroke-width="1" />
  

  <!-- Left Content Column -->
  <g transform="translate(80, 100)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="329" height="32" rx="16" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
    <text x="16" y="21" fill="#06b6d4" font-size="13" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      DISTRIBUTED INTELLIGENCE PLATFORM
    </text>

    <!-- Main Headline -->
    
    <text x="0" y="75" fill="#fafafa" font-size="48" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Autonomous AI Agent</tspan><tspan x="0" dy="56">Swarms</tspan>
    </text>
  

    <!-- Subtitle / Body Copy -->
    
    <text x="0" y="200" fill="#a1a1aa" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Orchestrate self-coordinating multi-agent</tspan><tspan x="0" dy="28">architectures engineered to solve complex,</tspan><tspan x="0" dy="28">high-throughput workflows at enterprise scale.</tspan>
    </text>
  

    <!-- CTA Button -->
    <g transform="translate(0, 300)" filter="url(#promo-12lrv-shadow)">
      <rect x="0" y="0" width="220" height="52" rx="26" fill="url(#promo-12lrv-primary-grad)" />
      <text x="95" y="32" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
        Deploy Swarm Cluster
      </text>
      
    <g transform="translate(165, 16)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <line x1="5" x2="19" y1="12" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  
      </svg>
    </g>
  
    </g>
  </g>

  <!-- Right Visual / Feature Cards Bento -->
  <g transform="translate(710, 120)">
    <!-- Big Decorative Backing Card -->
    <rect x="0" y="0" width="410" height="390" rx="20" fill="url(#promo-12lrv-card-grad)" stroke="#27272a" stroke-width="1.5" filter="url(#promo-12lrv-shadow)" />
    
    <!-- Feature items -->
    
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="350" height="90" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
          <!-- Icon Bubble -->
          <rect x="20" y="20" width="50" height="50" rx="12" fill="#06b6d4" fill-opacity="0.15" />
          
    <g transform="translate(33, 33)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
    <path d="M12 5v14"/>
  
      </svg>
    </g>
  
          <!-- Feature Title -->
          <text x="85" y="42" fill="#fafafa" font-size="17" font-weight="700" font-family="Inter, sans-serif">
            Decentralized Consensus
          </text>
          <!-- Feature Description -->
          <text x="85" y="62" fill="#a1a1aa" font-size="13" font-family="Inter, sans-serif">
            Fault-tolerant autonomous synchronization without centralized throughput bottlenecks.
          </text>
        </g>
      
        <g transform="translate(30, 145)">
          <rect x="0" y="0" width="350" height="90" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
          <!-- Icon Bubble -->
          <rect x="20" y="20" width="50" height="50" rx="12" fill="#06b6d4" fill-opacity="0.15" />
          
    <g transform="translate(33, 33)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <rect x="4" y="4" width="16" height="16" rx="2"/>
    <rect x="9" y="9" width="6" height="6"/>
    <path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>
  
      </svg>
    </g>
  
          <!-- Feature Title -->
          <text x="85" y="42" fill="#fafafa" font-size="17" font-weight="700" font-family="Inter, sans-serif">
            Dynamic Task Routing
          </text>
          <!-- Feature Description -->
          <text x="85" y="62" fill="#a1a1aa" font-size="13" font-family="Inter, sans-serif">
            Algorithmic execution pipelines that dynamically adapt to real-time workload variance.
          </text>
        </g>
      
        <g transform="translate(30, 260)">
          <rect x="0" y="0" width="350" height="90" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
          <!-- Icon Bubble -->
          <rect x="20" y="20" width="50" height="50" rx="12" fill="#06b6d4" fill-opacity="0.15" />
          
    <g transform="translate(33, 33)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  
          <!-- Feature Title -->
          <text x="85" y="42" fill="#fafafa" font-size="17" font-weight="700" font-family="Inter, sans-serif">
            Zero-Trust Mesh Security
          </text>
          <!-- Feature Description -->
          <text x="85" y="62" fill="#a1a1aa" font-size="13" font-family="Inter, sans-serif">
            Cryptographically verified inter-agent handshakes and immutable execution logs.
          </text>
        </g>
      
  </g>
</svg>