          </text>
          
          <!-- Feature Description (Wrapped dynamically to prevent box overflow) -->
          
    <text x="82" y="60" fill="#a1a1aa" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
