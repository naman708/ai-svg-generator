<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Why Vector Graphics Beat Pixel Bitmaps">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="social-design_010-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#1e1b4b" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="social-design_010-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#6366f1" />
        <stop offset="100%" stop-color="#c084fc" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="social-design_010-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="social-design_010-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="social-design_010-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="social-design_010-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#6366f1" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1080" height="1080" fill="url(#social-design_010-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1080" height="1080" fill="url(#social-design_010-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="972" cy="108" r="270" fill="#6366f1" filter="url(#social-design_010-glow)" />
      <circle cx="54" cy="972" r="216" fill="#c084fc" filter="url(#social-design_010-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1079" height="1079" rx="8" fill="none" stroke="#312e81" stroke-width="1" />
  

  <!-- Central Canvas Card -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="920" height="920" rx="28" fill="url(#social-design_010-card-grad)" stroke="#312e81" stroke-width="2" filter="url(#social-design_010-shadow)" />

    <!-- Top Badge Row -->
    <g transform="translate(60, 60)">
      <rect x="0" y="0" width="219" height="32" rx="16" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5" />
      <text x="109.5" y="21" fill="#6366f1" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1.2">
        DESIGN PHILOSOPHY
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(60, 120)">
      
    <text x="0" y="48" fill="#ffffff" font-size="44" font-weight="900" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Why Vector Graphics Beat Pixel</tspan><tspan x="0" dy="54">Bitmaps</tspan>
    </text>
  
    </g>

    <!-- Subtitle -->
    <g transform="translate(60, 310)">
      
    <text x="0" y="20" fill="#cbd5e1" font-size="18" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Why modern applications use procedural SVGs instead of</tspan><tspan x="0" dy="28">heavy, inflexible image files.</tspan>
    </text>
  
    </g>

    <line x1="60" y1="410" x2="860" y2="410" stroke="#312e81" stroke-width="1.5" />

    <!-- 3 Core Points -->
    <g transform="translate(60, 440)">
      
          <g transform="translate(0, 0)">
            <rect x="0" y="0" width="800" height="74" rx="16" fill="#1e1b4b" stroke="#312e81" stroke-width="1" />
            <circle cx="36" cy="37" r="18" fill="#6366f1" fill-opacity="0.2" />
            
    <g transform="translate(26, 27)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
            
            
    <text x="72" y="44" fill="#ffffff" font-size="16" font-weight="600" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="72" dy="0">Crisp scaling at any resolution, from tiny icons to 4K displays</tspan>
    </text>
  
          </g>
        
          <g transform="translate(0, 95)">
            <rect x="0" y="0" width="800" height="74" rx="16" fill="#1e1b4b" stroke="#312e81" stroke-width="1" />
            <circle cx="36" cy="37" r="18" fill="#6366f1" fill-opacity="0.2" />
            
    <g transform="translate(26, 27)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
            
            
    <text x="72" y="44" fill="#ffffff" font-size="16" font-weight="600" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="72" dy="0">Clean, human-readable code that can be tracked in Git</tspan>
    </text>
  
          </g>
        
          <g transform="translate(0, 190)">
            <rect x="0" y="0" width="800" height="74" rx="16" fill="#1e1b4b" stroke="#312e81" stroke-width="1" />
            <circle cx="36" cy="37" r="18" fill="#6366f1" fill-opacity="0.2" />
            
    <g transform="translate(26, 27)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
            
            
    <text x="72" y="44" fill="#ffffff" font-size="16" font-weight="600" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="72" dy="0">Tiny file sizes that load instantly without consuming bandwidth</tspan>
    </text>
  
          </g>
        
    </g>

    <!-- Footer Branding -->
    <g transform="translate(60, 770)">
      <rect x="0" y="0" width="800" height="80" rx="16" fill="url(#social-design_010-primary-grad)" fill-opacity="0.12" stroke="#6366f1" stroke-width="1" />
      
      <!-- Brand Icon & Text -->
      <circle cx="40" cy="40" r="20" fill="#6366f1" />
      
    <g transform="translate(30, 30)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
  
      </svg>
    </g>
  
      
      <text x="75" y="46" fill="#ffffff" font-size="16" font-weight="700" font-family="Inter, sans-serif">
        AI-Powered SVG Generation Engine
      </text>

      <text x="770" y="46" fill="#6366f1" font-size="14" font-weight="700" text-anchor="end" font-family="Inter, sans-serif">
        GENAI-ASSESSMENT #2026
      </text>
    </g>
  </g>
</svg>