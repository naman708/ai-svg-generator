<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Renewable Energy Adoption Benchmarks">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="stats-design_073-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc" />
        <stop offset="100%" stop-color="#e2e8f0" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="stats-design_073-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#4f46e5" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="stats-design_073-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="stats-design_073-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="stats-design_073-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="stats-design_073-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#2563eb" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#stats-design_073-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#stats-design_073-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#2563eb" filter="url(#stats-design_073-glow)" />
      <circle cx="60" cy="567" r="240" fill="#4f46e5" filter="url(#stats-design_073-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1" />
  

  <!-- Header Banner -->
  <g transform="translate(80, 70)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="192" height="30" rx="15" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5" />
    <text x="15" y="20" fill="#2563eb" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      CLEAN TECH METRICS
    </text>

    <!-- Headline -->
    
    <text x="0" y="65" fill="#0f172a" font-size="40" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Renewable Energy Adoption Benchmarks</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="110" fill="#64748b" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Key worldwide deployment numbers showing the accelerating shift toward clean</tspan><tspan x="0" dy="24">energy sources.</tspan>
    </text>
  
  </g>

  <!-- 3 Metric Cards Grid -->
  <g transform="translate(80, 230)">
    
        <g transform="translate(0, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_073-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stats-design_073-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/>
    <path d="M2 21c0-3 1.85-5.36 5.08-6"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#4f46e5" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1" />
            <text x="225" y="24" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              Global Grid Growth
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#0f172a" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            85%
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#2563eb" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            New Clean Capacity
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#cbd5e1" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Renewables accounted for the</tspan><tspan x="24" dy="20">vast majority of new power added</tspan><tspan x="24" dy="20">in 2025</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#2563eb" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#2563eb" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#2563eb" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#4f46e5" />
          </g>
        </g>
      
        <g transform="translate(360, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_073-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stats-design_073-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
    <polyline points="16 7 22 7 22 13"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#4f46e5" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1" />
            <text x="225" y="24" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              Past 10 Years
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#0f172a" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            -82%
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#2563eb" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Battery Cost Decline
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#cbd5e1" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Cheaper grid batteries make</tspan><tspan x="24" dy="20">round-the-clock solar power</tspan><tspan x="24" dy="20">affordable</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#2563eb" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#2563eb" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#2563eb" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#4f46e5" />
          </g>
        </g>
      
        <g transform="translate(720, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_073-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stats-design_073-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#4f46e5" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1" />
            <text x="225" y="24" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              Global Record
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#0f172a" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            3.2 TW
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#2563eb" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Total Installed Solar
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#cbd5e1" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Clean solar generation now</tspan><tspan x="24" dy="20">powers hundreds of millions of</tspan><tspan x="24" dy="20">homes</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#2563eb" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#2563eb" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#2563eb" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#4f46e5" />
          </g>
        </g>
      
  </g>
</svg>