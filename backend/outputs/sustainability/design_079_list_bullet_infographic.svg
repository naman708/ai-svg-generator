<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" role="img" aria-label="5 Ways to Cut Software Carbon Emissions">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="list-design_079-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc" />
        <stop offset="100%" stop-color="#e2e8f0" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="list-design_079-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#4f46e5" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="list-design_079-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="list-design_079-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="list-design_079-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="list-design_079-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#2563eb" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="800" height="1200" fill="url(#list-design_079-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="800" height="1200" fill="url(#list-design_079-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="720" cy="120" r="200" fill="#2563eb" filter="url(#list-design_079-glow)" />
      <circle cx="40" cy="1080" r="160" fill="#4f46e5" filter="url(#list-design_079-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="799" height="1199" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1" />
  

  <!-- Header Banner -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="186" height="30" rx="15" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1.5" />
    <text x="93" y="20" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1.2">
      GREEN SOFTWARE
    </text>

    <!-- Main Title -->
    
    <text x="0" y="65" fill="#0f172a" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">5 Ways to Cut Software Carbon</tspan><tspan x="0" dy="44">Emissions</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="165" fill="#64748b" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Software engineering techniques that minimize server electricity</tspan><tspan x="0" dy="24">consumption and environmental impact.</tspan>
    </text>
  

    <line x1="0" y1="225" x2="680" y2="225" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- 5 Sequential List Cards -->
  <g transform="translate(60, 315)">
    
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_079-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_079-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            1
          </text>

          <!-- Row Content -->
          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#0f172a" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Adopt Lightweight Vector SVGs</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Replace heavy raster images with scalable math-based</tspan><tspan x="0" dy="22">vector files.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polyline points="16 18 22 12 16 6"/>
    <polyline points="8 6 2 12 8 18"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 155)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_079-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_079-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            2
          </text>

          <!-- Row Content -->
          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#0f172a" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Colocate Compute with Clean Grids</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Schedule non-urgent batch workloads in regions with</tspan><tspan x="0" dy="22">excess green power.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
    <path d="M2 12h20"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 310)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_079-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_079-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            3
          </text>

          <!-- Row Content -->
          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#0f172a" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Implement Aggressive Caching</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Prevent unnecessary compute cycles by caching</tspan><tspan x="0" dy="22">responses at the edge.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
    <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 465)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_079-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_079-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            4
          </text>

          <!-- Row Content -->
          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#0f172a" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Prune Stale Cloud Storage</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Delete orphan database backups and unused</tspan><tspan x="0" dy="22">development clusters.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 620)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_079-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_079-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            5
          </text>

          <!-- Row Content -->
          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#0f172a" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Optimize Code Algorithms</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Refactor quadratic O(n^2) routines to linear O(n)</tspan><tspan x="0" dy="22">execution times.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
  
      </svg>
    </g>
  
        </g>
      
  </g>

  <!-- Footer -->
  <g transform="translate(60, 1130)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#cbd5e1" stroke-width="1" />
    <text x="0" y="32" fill="#64748b" font-size="13" font-family="Inter, sans-serif">
      Synthesized Vector Framework • Shri Genesis AI Technical Assessment
    </text>
    <text x="680" y="32" fill="#2563eb" font-size="13" font-weight="600" text-anchor="end" font-family="Inter, sans-serif">
      100% Vector Scalable
    </text>
  </g>
</svg>