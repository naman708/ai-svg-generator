<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The 4 Pillars of Modern Demand Gen">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="steps-design_094-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1c102b" />
        <stop offset="100%" stop-color="#2e123d" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="steps-design_094-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f97316" />
        <stop offset="100%" stop-color="#ec4899" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="steps-design_094-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38174a" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#38174a" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="steps-design_094-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="steps-design_094-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="steps-design_094-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#f97316" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
