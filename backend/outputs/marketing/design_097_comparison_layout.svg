    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#ffffff" font-size="15" font-weight="500" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">High retention rates among</tspan><tspan x="48" dy="22">organic inbound signups</tspan>
    </text>
  
          </g>
        
          <g transform="translate(0, 150)">
            <circle cx="16" cy="16" r="16" fill="#f97316" fill-opacity="0.2" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#ffffff" font-size="15" font-weight="500" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Clear attribution to</tspan><tspan x="48" dy="22">closed-won annual recurring...</tspan>
    </text>
  
          </g>
        
    </g>
  </g>
</svg>