<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Vanity Metrics vs. Pipeline Reality">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="comp-design_097-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1c102b" />
        <stop offset="100%" stop-color="#2e123d" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="comp-design_097-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f97316" />
        <stop offset="100%" stop-color="#ec4899" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="comp-design_097-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38174a" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#38174a" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="comp-design_097-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="comp-design_097-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="comp-design_097-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#f97316" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#comp-design_097-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#comp-design_097-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#f97316" filter="url(#comp-design_097-glow)" />
      <circle cx="60" cy="567" r="240" fill="#ec4899" filter="url(#comp-design_097-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#562270" stroke-width="1" />
  

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="186" height="30" rx="15" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1.5" />
    <text x="93" y="20" fill="#f97316" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1.2">
      GROWTH METRICS
    </text>

    
    <text x="0" y="65" fill="#ffffff" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Vanity Metrics vs. Pipeline Reality</tspan>
    </text>
  
  </g>

  <!-- Left Column: Legacy / Problem -->
  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="480" height="400" rx="20" fill="url(#comp-design_097-card-grad)" stroke="#562270" stroke-width="1.5" filter="url(#comp-design_097-shadow)" />
    
    <!-- Header inside Left Card -->
    <g transform="translate(35, 35)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
      <text x="65" y="18" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
        LOOKS GOOD, ZERO VALUE
      </text>

      
    <text x="0" y="65" fill="#ffffff" font-size="24" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Vanity Metrics</tspan>
    </text>
  
    </g>

    <!-- Points List -->
    <g transform="translate(35, 140)">
      
          <g transform="translate(0, 0)">
            <circle cx="16" cy="16" r="16" fill="#ef4444" fill-opacity="0.15" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#fbcfe8" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Raw pageviews that bounce</tspan><tspan x="48" dy="22">without reading or acting</tspan>
    </text>
  
          </g>
        
          <g transform="translate(0, 75)">
            <circle cx="16" cy="16" r="16" fill="#ef4444" fill-opacity="0.15" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#fbcfe8" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Social media likes from</tspan><tspan x="48" dy="22">non-buyer demographics</tspan>
    </text>
  
          </g>
        
          <g transform="translate(0, 150)">
            <circle cx="16" cy="16" r="16" fill="#ef4444" fill-opacity="0.15" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#fbcfe8" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Bloated subscriber counts with</tspan><tspan x="48" dy="22">12% open rates</tspan>
    </text>
  
          </g>
        
    </g>
  </g>

  <!-- Central "VS" Badge -->
  <g transform="translate(580, 340)">
    <circle cx="20" cy="20" r="28" fill="#1c102b" stroke="#f97316" stroke-width="2" filter="url(#comp-design_097-shadow)" />
    <text x="20" y="27" fill="#ffffff" font-size="16" font-weight="900" text-anchor="middle" font-family="Inter, sans-serif">
      VS
    </text>
  </g>

  <!-- Right Column: AI / Modern -->
  <g transform="translate(640, 170)">
    <rect x="0" y="0" width="480" height="400" rx="20" fill="url(#comp-design_097-card-grad)" stroke="#f97316" stroke-width="2" filter="url(#comp-design_097-shadow)" />
    
    <!-- Header inside Right Card -->
    <g transform="translate(35, 35)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1" />
      <text x="65" y="18" fill="#f97316" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
