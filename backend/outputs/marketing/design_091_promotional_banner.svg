<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Hyper-Personalized Customer Journeys">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="promo-design_091-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1c102b" />
        <stop offset="100%" stop-color="#2e123d" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="promo-design_091-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f97316" />
        <stop offset="100%" stop-color="#ec4899" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="promo-design_091-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#38174a" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#38174a" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="promo-design_091-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="promo-design_091-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="promo-design_091-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#f97316" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#promo-design_091-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#promo-design_091-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#f97316" filter="url(#promo-design_091-glow)" />
      <circle cx="60" cy="567" r="240" fill="#ec4899" filter="url(#promo-design_091-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#562270" stroke-width="1" />
  

  <!-- Left Content Column -->
  <g transform="translate(80, 85)">
    <!-- Category Badge (Dynamic width with safe padding) -->
    <rect x="0" y="0" width="212" height="32" rx="16" fill="#f97316" fill-opacity="0.2" stroke="#f97316" stroke-width="1.5" />
    <text x="18" y="21" fill="#f97316" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.2">
      GROWTH MARKETING
    </text>

    <!-- Main Headline (Optimized sizing & line-wrap) -->
    
    <text x="0" y="75" fill="#ffffff" font-size="42" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Hyper-Personalized</tspan><tspan x="0" dy="52">Customer Journeys</tspan>
    </text>
  

    <!-- Subtitle / Body Copy -->
    
    <text x="0" y="200" fill="#fbcfe8" font-size="16" font-weight="400" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Dynamically generate bespoke landing</tspan><tspan x="0" dy="26">pages, email copy, and vector graphics</tspan><tspan x="0" dy="26">tailored to individual customer intent.</tspan>
    </text>
  

    <!-- CTA Button (Dynamic width & calculated icon spacing) -->
    <g transform="translate(0, 320)" filter="url(#promo-design_091-shadow)">
      <rect x="0" y="0" width="324" height="52" rx="26" fill="url(#promo-design_091-primary-grad)" />
      <text x="146" y="32" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
        Request Enterprise Pilot
      </text>
      
    <g transform="translate(288, 16)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <line x1="5" x2="19" y1="12" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  
      </svg>
    </g>
  
    </g>
  </g>

  <!-- Right Visual / Feature Cards Bento -->
