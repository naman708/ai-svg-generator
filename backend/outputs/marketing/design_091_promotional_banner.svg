    </g>
  
          
          <!-- Feature Title -->
          <text x="82" y="38" fill="#ffffff" font-size="16" font-weight="700" font-family="Inter, sans-serif">
            Omnichannel Sync
          </text>
          
          <!-- Feature Description (Wrapped dynamically to prevent box overflow) -->
          
    <text x="82" y="60" fill="#fbcfe8" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="82" dy="0">Seamless web, mobile, and ad</tspan><tspan x="82" dy="18">delivery</tspan>
    </text>
  
