    <rect x="0" y="0" width="440" height="415" rx="20" fill="url(#promo-design_091-card-grad)" stroke="#562270" stroke-width="1.5" filter="url(#promo-design_091-shadow)" />
    
    <!-- Feature items -->
    
        <g transform="translate(25, 24)">
          <rect x="0" y="0" width="390" height="104" rx="14" fill="#38174a" stroke="#562270" stroke-width="1" />
          
          <!-- Icon Bubble -->
          <rect x="18" y="27" width="50" height="50" rx="12" fill="#f97316" fill-opacity="0.15" />
          
    <g transform="translate(31, 40)" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
  
      </svg>
    </g>
  
          
          <!-- Feature Title -->
          <text x="82" y="38" fill="#ffffff" font-size="16" font-weight="700" font-family="Inter, sans-serif">
            Intent Prediction
          </text>
          
          <!-- Feature Description (Wrapped dynamically to prevent box overflow) -->
          
    <text x="82" y="60" fill="#fbcfe8" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="82" dy="0">Real-time behavioural scoring</tspan>
    </text>
  
        </g>
      
        <g transform="translate(25, 148)">
          <rect x="0" y="0" width="390" height="104" rx="14" fill="#38174a" stroke="#562270" stroke-width="1" />
          
          <!-- Icon Bubble -->
          <rect x="18" y="27" width="50" height="50" rx="12" fill="#f97316" fill-opacity="0.15" />
          
    <g transform="translate(31, 40)" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
  
      </svg>
    </g>
  
          
          <!-- Feature Title -->
          <text x="82" y="38" fill="#ffffff" font-size="16" font-weight="700" font-family="Inter, sans-serif">
            Dynamic Creatives
          </text>
          
          <!-- Feature Description (Wrapped dynamically to prevent box overflow) -->
          
    <text x="82" y="60" fill="#fbcfe8" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="82" dy="0">Modular vector hero graphics</tspan>
    </text>
  
        </g>
      
        <g transform="translate(25, 272)">
          <rect x="0" y="0" width="390" height="104" rx="14" fill="#38174a" stroke="#562270" stroke-width="1" />
          
          <!-- Icon Bubble -->
          <rect x="18" y="27" width="50" height="50" rx="12" fill="#f97316" fill-opacity="0.15" />
          
    <g transform="translate(31, 40)" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
    <path d="M2 12h20"/>
  
