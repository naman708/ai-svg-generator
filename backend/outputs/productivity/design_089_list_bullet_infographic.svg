      <tspan x="0" dy="0">Perform A Weekly Review Reset</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Empty digital inboxes, review active goals, and</tspan><tspan x="0" dy="22">clear your desk every Friday.</tspan>
    </text>
  
