<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Decentralized Clinical Trials Engine">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="feat-design_038-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#1e1b4b" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="feat-design_038-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#6366f1" />
        <stop offset="100%" stop-color="#c084fc" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="feat-design_038-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="feat-design_038-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="feat-design_038-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="feat-design_038-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#6366f1" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#feat-design_038-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#feat-design_038-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#6366f1" filter="url(#feat-design_038-glow)" />
      <circle cx="60" cy="567" r="240" fill="#c084fc" filter="url(#feat-design_038-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#312e81" stroke-width="1" />
  

  <!-- Top Header -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="183" height="30" rx="15" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5" />
    <text x="15" y="20" fill="#6366f1" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      CLINICAL RESEARCH
    </text>

    
    <text x="0" y="65" fill="#ffffff" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Decentralized Clinical Trials Engine</tspan>
    </text>
  
  </g>

  <!-- Left Hero Bento Card -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="500" height="410" rx="20" fill="url(#feat-design_038-card-grad)" stroke="#312e81" stroke-width="1.5" filter="url(#feat-design_038-shadow)" />
    
    <!-- Hero Icon Bubble -->
    <rect x="40" y="40" width="64" height="64" rx="16" fill="url(#feat-design_038-primary-grad)" />
    
    <g transform="translate(56, 56)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <svg width="32" height="32" viewBox="0 0 24 24">
        
    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
    <path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>
  
      </svg>
    </g>
  

    <!-- Tag Pill -->
    <rect x="120" y="58" width="130" height="26" rx="13" fill="#6366f1" fill-opacity="0.15" />
    <text x="185" y="75" fill="#6366f1" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1">
      CONTINUOUS TELEMETRY
    </text>

    <!-- Hero Title -->
    <text x="40" y="160" fill="#ffffff" font-size="28" font-weight="800" font-family="Inter, sans-serif">
      Wearable Biomarker Streaming
    </text>

    <!-- Hero Body -->
    
    <text x="40" y="200" fill="#cbd5e1" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="40" dy="0">Continuous physiological monitoring</tspan><tspan x="40" dy="28">capturing real-world clinical</tspan><tspan x="40" dy="28">endpoints directly from patient</tspan><tspan x="40" dy="28">wearables with cryptographic</tspan><tspan x="40" dy="28">verification.</tspan>
    </text>
  

    <!-- Bottom Indicator -->
    <g transform="translate(40, 345)">
      <circle cx="6" cy="6" r="6" fill="#c084fc" />
      <text x="22" y="10" fill="#ffffff" font-size="13" font-weight="600" font-family="Inter, sans-serif">
        Enterprise Standard Production Module
      </text>
    </g>
  </g>

  <!-- Right Stacked 2 Bento Cards -->
  <g transform="translate(610, 160)">
    
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="510" height="195" rx="18" fill="url(#feat-design_038-card-grad)" stroke="#312e81" stroke-width="1.5" filter="url(#feat-design_038-shadow)" />
          
          <!-- Icon Bubble -->
          <rect x="30" y="30" width="48" height="48" rx="12" fill="#6366f1" fill-opacity="0.15" />
          
    <g transform="translate(42, 42)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  

          <!-- Title -->
          <text x="95" y="60" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Direct Patient eConsent
          </text>

          <!-- Description -->
          
    <text x="30" y="110" fill="#cbd5e1" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="30" dy="0">Multilingual compliant digital consent signing</tspan><tspan x="30" dy="24">on mobile.</tspan>
    </text>
  
        </g>
      
        <g transform="translate(0, 215)">
          <rect x="0" y="0" width="510" height="195" rx="18" fill="url(#feat-design_038-card-grad)" stroke="#312e81" stroke-width="1.5" filter="url(#feat-design_038-shadow)" />
          
          <!-- Icon Bubble -->
          <rect x="30" y="30" width="48" height="48" rx="12" fill="#6366f1" fill-opacity="0.15" />
          
    <g transform="translate(42, 42)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  

          <!-- Title -->
          <text x="95" y="60" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Automated Adverse Event Detection
          </text>

          <!-- Description -->
          
    <text x="30" y="110" fill="#cbd5e1" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="30" dy="0">Instantaneous alerting for vital anomalies.</tspan>
    </text>
  
        </g>
      
  </g>
</svg>