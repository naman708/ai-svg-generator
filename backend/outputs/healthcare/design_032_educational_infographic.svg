<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" role="img" aria-label="How mRNA Vaccines Function">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="edu-design_032-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06281e" />
        <stop offset="100%" stop-color="#0b3d2e" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="edu-design_032-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#a7f3d0" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="edu-design_032-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0e4a38" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#0e4a38" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="edu-design_032-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="edu-design_032-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="edu-design_032-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#10b981" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="800" height="1200" fill="url(#edu-design_032-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="800" height="1200" fill="url(#edu-design_032-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="720" cy="120" r="200" fill="#10b981" filter="url(#edu-design_032-glow)" />
      <circle cx="40" cy="1080" r="160" fill="#a7f3d0" filter="url(#edu-design_032-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="799" height="1199" rx="8" fill="none" stroke="#145a44" stroke-width="1" />
  

  <!-- Header Section -->
  <g transform="translate(60, 60)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="192" height="30" rx="15" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="20" fill="#10b981" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      BIOMEDICAL SCIENCE
    </text>

    <!-- Main Title -->
    
    <text x="0" y="65" fill="#f0fdf4" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">How mRNA Vaccines Function</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="165" fill="#a7f3d0" font-size="16" font-weight="400" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">A visual walkthrough of cellular immune response generation</tspan><tspan x="0" dy="24">without using live pathogens.</tspan>
    </text>
  
    
    <!-- Dividing Accent Line -->
    <line x1="0" y1="220" x2="680" y2="220" stroke="#145a44" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Educational Concept Cards (4 Stacked) -->
  <g transform="translate(60, 310)">
    
        <g transform="translate(0, 0)">
          <!-- Card Container -->
          <rect x="0" y="0" width="680" height="170" rx="16" fill="url(#edu-design_032-card-grad)" stroke="#145a44" stroke-width="1.5" filter="url(#edu-design_032-shadow)" />
          
          <!-- Number Badge -->
          <rect x="25" y="25" width="48" height="48" rx="12" fill="#10b981" />
          <text x="49" y="55" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            01
          </text>

          <!-- Card Header & Icon -->
          <text x="95" y="54" fill="#f0fdf4" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Lipid Nanoparticle Delivery
          </text>
          
    <g transform="translate(615, 30)" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="26" height="26" viewBox="0 0 24 24">
        
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
  
      </svg>
    </g>
  

          <!-- Card Body Description -->
          
    <text x="95" y="95" fill="#a7f3d0" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="95" dy="0">Protects delicate mRNA molecules and enables</tspan><tspan x="95" dy="24">cellular fusion.</tspan>
    </text>
  
        </g>
      
        <g transform="translate(0, 195)">
          <!-- Card Container -->
          <rect x="0" y="0" width="680" height="170" rx="16" fill="url(#edu-design_032-card-grad)" stroke="#145a44" stroke-width="1.5" filter="url(#edu-design_032-shadow)" />
          
          <!-- Number Badge -->
          <rect x="25" y="25" width="48" height="48" rx="12" fill="#10b981" />
          <text x="49" y="55" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            02
          </text>

          <!-- Card Header & Icon -->
          <text x="95" y="54" fill="#f0fdf4" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Ribosomal Translation
          </text>
          
    <g transform="translate(615, 30)" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="26" height="26" viewBox="0 0 24 24">
        
    <rect x="4" y="4" width="16" height="16" rx="2"/>
    <rect x="9" y="9" width="6" height="6"/>
    <path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>
  
      </svg>
    </g>
  

          <!-- Card Body Description -->
          
    <text x="95" y="95" fill="#a7f3d0" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="95" dy="0">Host cellular machinery reads mRNA instructions to</tspan><tspan x="95" dy="24">synthesize spike protein.</tspan>
    </text>
  
        </g>
      
        <g transform="translate(0, 390)">
          <!-- Card Container -->
          <rect x="0" y="0" width="680" height="170" rx="16" fill="url(#edu-design_032-card-grad)" stroke="#145a44" stroke-width="1.5" filter="url(#edu-design_032-shadow)" />
          
          <!-- Number Badge -->
          <rect x="25" y="25" width="48" height="48" rx="12" fill="#10b981" />
          <text x="49" y="55" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            03
          </text>

          <!-- Card Header & Icon -->
          <text x="95" y="54" fill="#f0fdf4" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Antigen Presentation
          </text>
          
    <g transform="translate(615, 30)" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="26" height="26" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <circle cx="12" cy="12" r="6"/>
    <circle cx="12" cy="12" r="2"/>
  
      </svg>
    </g>
  

          <!-- Card Body Description -->
          
    <text x="95" y="95" fill="#a7f3d0" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="95" dy="0">Spike protein fragments displayed on cell surface to</tspan><tspan x="95" dy="24">trigger T-cells.</tspan>
    </text>
  
        </g>
      
        <g transform="translate(0, 585)">
          <!-- Card Container -->
          <rect x="0" y="0" width="680" height="170" rx="16" fill="url(#edu-design_032-card-grad)" stroke="#145a44" stroke-width="1.5" filter="url(#edu-design_032-shadow)" />
          
          <!-- Number Badge -->
          <rect x="25" y="25" width="48" height="48" rx="12" fill="#10b981" />
          <text x="49" y="55" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            04
          </text>

          <!-- Card Header & Icon -->
          <text x="95" y="54" fill="#f0fdf4" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Immune Memory Synthesis
          </text>
          
    <g transform="translate(615, 30)" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="26" height="26" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  

          <!-- Card Body Description -->
          
    <text x="95" y="95" fill="#a7f3d0" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="95" dy="0">B-cells produce neutralizing antibodies establishing</tspan><tspan x="95" dy="24">lasting defense.</tspan>
    </text>
  
        </g>
      
  </g>

  <!-- Footer Info -->
  <g transform="translate(60, 1130)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#145a44" stroke-width="1" />
    <text x="0" y="32" fill="#a7f3d0" font-size="13" font-family="Inter, sans-serif">
      AI-Powered Vector Infographic Engine • Generated Visual Guide
    </text>
    <text x="680" y="32" fill="#10b981" font-size="13" font-weight="600" text-anchor="end" font-family="Inter, sans-serif">
      Open Standards • Production Ready
    </text>
  </g>
</svg>