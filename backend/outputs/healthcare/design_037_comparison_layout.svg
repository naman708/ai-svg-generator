<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Sick-Care vs. Preventive Health">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="comp-design_037-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06281e" />
        <stop offset="100%" stop-color="#0b3d2e" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="comp-design_037-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#a7f3d0" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="comp-design_037-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0e4a38" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#0e4a38" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="comp-design_037-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="comp-design_037-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="comp-design_037-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#10b981" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#comp-design_037-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#comp-design_037-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#10b981" filter="url(#comp-design_037-glow)" />
      <circle cx="60" cy="567" r="240" fill="#a7f3d0" filter="url(#comp-design_037-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#145a44" stroke-width="1" />
  

  <!-- Header -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="164" height="30" rx="15" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="82" y="20" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1.2">
      HEALTH MODEL
    </text>

    
    <text x="0" y="65" fill="#f0fdf4" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Sick-Care vs. Preventive Health</tspan>
    </text>
  
  </g>

  <!-- Left Column: Legacy / Problem -->
  <g transform="translate(80, 170)">
    <rect x="0" y="0" width="480" height="400" rx="20" fill="url(#comp-design_037-card-grad)" stroke="#145a44" stroke-width="1.5" filter="url(#comp-design_037-shadow)" />
    
    <!-- Header inside Left Card -->
    <g transform="translate(35, 35)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1" />
      <text x="65" y="18" fill="#f87171" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
        TRADITIONAL
      </text>

      
    <text x="0" y="65" fill="#f0fdf4" font-size="24" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Reactive Sick-Care</tspan>
    </text>
  
    </g>

    <!-- Points List -->
    <g transform="translate(35, 140)">
      
          <g transform="translate(0, 0)">
            <circle cx="16" cy="16" r="16" fill="#ef4444" fill-opacity="0.15" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#a7f3d0" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Treats symptoms only after</tspan><tspan x="48" dy="22">illnesses have already...</tspan>
    </text>
  
          </g>
        
          <g transform="translate(0, 75)">
            <circle cx="16" cy="16" r="16" fill="#ef4444" fill-opacity="0.15" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#a7f3d0" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Expensive hospital stays and</tspan><tspan x="48" dy="22">emergency room interventions</tspan>
    </text>
  
          </g>
        
          <g transform="translate(0, 150)">
            <circle cx="16" cy="16" r="16" fill="#ef4444" fill-opacity="0.15" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#a7f3d0" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Patients left to manage</tspan><tspan x="48" dy="22">complex chronic conditions...</tspan>
    </text>
  
          </g>
        
    </g>
  </g>

  <!-- Central "VS" Badge -->
  <g transform="translate(580, 340)">
    <circle cx="20" cy="20" r="28" fill="#06281e" stroke="#10b981" stroke-width="2" filter="url(#comp-design_037-shadow)" />
    <text x="20" y="27" fill="#f0fdf4" font-size="16" font-weight="900" text-anchor="middle" font-family="Inter, sans-serif">
      VS
    </text>
  </g>

  <!-- Right Column: AI / Modern -->
  <g transform="translate(640, 170)">
    <rect x="0" y="0" width="480" height="400" rx="20" fill="url(#comp-design_037-card-grad)" stroke="#10b981" stroke-width="2" filter="url(#comp-design_037-shadow)" />
    
    <!-- Header inside Right Card -->
    <g transform="translate(35, 35)">
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
      <text x="65" y="18" fill="#10b981" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
        PROACTIVE
      </text>

      
    <text x="0" y="65" fill="#f0fdf4" font-size="24" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Preventive Care</tspan>
    </text>
  
    </g>

    <!-- Points List -->
    <g transform="translate(35, 140)">
      
          <g transform="translate(0, 0)">
            <circle cx="16" cy="16" r="16" fill="#10b981" fill-opacity="0.2" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#f0fdf4" font-size="15" font-weight="500" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Monitors daily biomarkers to</tspan><tspan x="48" dy="22">catch warning signs early</tspan>
    </text>
  
          </g>
        
          <g transform="translate(0, 75)">
            <circle cx="16" cy="16" r="16" fill="#10b981" fill-opacity="0.2" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#f0fdf4" font-size="15" font-weight="500" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Focuses on nutrition, restful</tspan><tspan x="48" dy="22">sleep, and regular exercise</tspan>
    </text>
  
          </g>
        
          <g transform="translate(0, 150)">
            <circle cx="16" cy="16" r="16" fill="#10b981" fill-opacity="0.2" />
            
    <g transform="translate(6, 6)" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
            
    <text x="48" y="16" fill="#f0fdf4" font-size="15" font-weight="500" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="48" dy="0">Lowers long-term medical costs</tspan><tspan x="48" dy="22">while improving daily energy</tspan>
    </text>
  
          </g>
        
    </g>
  </g>
</svg>