<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="4 Stages to Zero Trust Maturity">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="steps-design_024-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#1e1b4b" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="steps-design_024-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#6366f1" />
        <stop offset="100%" stop-color="#c084fc" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="steps-design_024-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="steps-design_024-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="steps-design_024-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="steps-design_024-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#6366f1" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#steps-design_024-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#steps-design_024-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#6366f1" filter="url(#steps-design_024-glow)" />
      <circle cx="60" cy="567" r="240" fill="#c084fc" filter="url(#steps-design_024-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#312e81" stroke-width="1" />
  

  <!-- Header Section -->
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="208" height="30" rx="15" fill="#6366f1" fill-opacity="0.2" stroke="#6366f1" stroke-width="1.5" />
    <text x="104" y="20" fill="#6366f1" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1.2">
      SECURITY ROADMAP
    </text>

    <!-- Main Title -->
    
    <text x="0" y="65" fill="#ffffff" font-size="38" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">4 Stages to Zero Trust Maturity</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="110" fill="#cbd5e1" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">A practical roadmap to eliminate implicit trust and secure hybrid cloud</tspan><tspan x="0" dy="24">infrastructure.</tspan>
    </text>
  
  </g>

  <!-- Horizontal Connector Line between Nodes -->
  <line x1="180" y1="260" x2="1020" y2="260" stroke="#6366f1" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />

  <!-- 4 Step Cards -->
  <g transform="translate(80, 210)">
    
        <g transform="translate(0, 0)">
          <!-- Circular Node Pin on the connecting line -->
          <circle cx="115" cy="50" r="28" fill="#0f172a" stroke="#6366f1" stroke-width="3" filter="url(#steps-design_024-shadow)" />
          <text x="115" y="56" fill="#6366f1" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            01
          </text>

          <!-- Step Card Container below the node -->
          <g transform="translate(0, 100)">
            <rect x="0" y="0" width="230" height="220" rx="16" fill="url(#steps-design_024-card-grad)" stroke="#312e81" stroke-width="1.5" filter="url(#steps-design_024-shadow)" />
            
            <!-- Icon Wrapper -->
            <rect x="20" y="20" width="44" height="44" rx="10" fill="#6366f1" fill-opacity="0.15" />
            
    <g transform="translate(30, 30)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  
      </svg>
    </g>
  

            <!-- Step Title (Safely bounded) -->
            
    <text x="20" y="95" fill="#ffffff" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Centralize...</tspan>
    </text>
  

            <!-- Step Description -->
            
    <text x="20" y="125" fill="#cbd5e1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Enforce hardware MFA</tspan><tspan x="20" dy="22">and single sign-on</tspan><tspan x="20" dy="22">across all internal</tspan><tspan x="20" dy="22">tools.</tspan>
    </text>
  
          </g>
        </g>
      
        <g transform="translate(265, 0)">
          <!-- Circular Node Pin on the connecting line -->
          <circle cx="115" cy="50" r="28" fill="#0f172a" stroke="#6366f1" stroke-width="3" filter="url(#steps-design_024-shadow)" />
          <text x="115" y="56" fill="#6366f1" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            02
          </text>

          <!-- Step Card Container below the node -->
          <g transform="translate(0, 100)">
            <rect x="0" y="0" width="230" height="220" rx="16" fill="url(#steps-design_024-card-grad)" stroke="#312e81" stroke-width="1.5" filter="url(#steps-design_024-shadow)" />
            
            <!-- Icon Wrapper -->
            <rect x="20" y="20" width="44" height="44" rx="10" fill="#6366f1" fill-opacity="0.15" />
            
    <g transform="translate(30, 30)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <rect x="4" y="4" width="16" height="16" rx="2"/>
    <rect x="9" y="9" width="6" height="6"/>
    <path d="M15 2v2M9 2v2M15 20v2M9 20v2M2 15h2M2 9h2M20 15h2M20 9h2"/>
  
      </svg>
    </g>
  

            <!-- Step Title (Safely bounded) -->
            
    <text x="20" y="95" fill="#ffffff" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Device Telemetry</tspan>
    </text>
  

            <!-- Step Description -->
            
    <text x="20" y="125" fill="#cbd5e1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Verify system patches</tspan><tspan x="20" dy="22">and disk encryption</tspan><tspan x="20" dy="22">before granting</tspan><tspan x="20" dy="22">access.</tspan>
    </text>
  
          </g>
        </g>
      
        <g transform="translate(530, 0)">
          <!-- Circular Node Pin on the connecting line -->
          <circle cx="115" cy="50" r="28" fill="#0f172a" stroke="#6366f1" stroke-width="3" filter="url(#steps-design_024-shadow)" />
          <text x="115" y="56" fill="#6366f1" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            03
          </text>

          <!-- Step Card Container below the node -->
          <g transform="translate(0, 100)">
            <rect x="0" y="0" width="230" height="220" rx="16" fill="url(#steps-design_024-card-grad)" stroke="#312e81" stroke-width="1.5" filter="url(#steps-design_024-shadow)" />
            
            <!-- Icon Wrapper -->
            <rect x="20" y="20" width="44" height="44" rx="10" fill="#6366f1" fill-opacity="0.15" />
            
    <g transform="translate(30, 30)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
  
      </svg>
    </g>
  

            <!-- Step Title (Safely bounded) -->
            
    <text x="20" y="95" fill="#ffffff" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Micro-Segmentation</tspan>
    </text>
  

            <!-- Step Description -->
            
    <text x="20" y="125" fill="#cbd5e1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Block direct</tspan><tspan x="20" dy="22">server-to-server</tspan><tspan x="20" dy="22">traffic between</tspan><tspan x="20" dy="22">distinct...</tspan>
    </text>
  
          </g>
        </g>
      
        <g transform="translate(795, 0)">
          <!-- Circular Node Pin on the connecting line -->
          <circle cx="115" cy="50" r="28" fill="#0f172a" stroke="#6366f1" stroke-width="3" filter="url(#steps-design_024-shadow)" />
          <text x="115" y="56" fill="#6366f1" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            04
          </text>

          <!-- Step Card Container below the node -->
          <g transform="translate(0, 100)">
            <rect x="0" y="0" width="230" height="220" rx="16" fill="url(#steps-design_024-card-grad)" stroke="#312e81" stroke-width="1.5" filter="url(#steps-design_024-shadow)" />
            
            <!-- Icon Wrapper -->
            <rect x="20" y="20" width="44" height="44" rx="10" fill="#6366f1" fill-opacity="0.15" />
            
    <g transform="translate(30, 30)" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  

            <!-- Step Title (Safely bounded) -->
            
    <text x="20" y="95" fill="#ffffff" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Adaptive Access</tspan>
    </text>
  

            <!-- Step Description -->
            
    <text x="20" y="125" fill="#cbd5e1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Revoke sessions</tspan><tspan x="20" dy="22">automatically when</tspan><tspan x="20" dy="22">unusual behavior is</tspan><tspan x="20" dy="22">spotted.</tspan>
    </text>
  
          </g>
        </g>
      
  </g>
</svg>