    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 155)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_029-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_029-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            2
          </text>

