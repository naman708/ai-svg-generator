<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Global Threat Correlation Platform">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="feat-design_028-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#180c0e" />
        <stop offset="100%" stop-color="#2d1217" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="feat-design_028-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ef4444" />
        <stop offset="100%" stop-color="#fbbf24" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="feat-design_028-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3f141c" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#3f141c" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="feat-design_028-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="feat-design_028-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="feat-design_028-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#ef4444" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#feat-design_028-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#feat-design_028-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#ef4444" filter="url(#feat-design_028-glow)" />
      <circle cx="60" cy="567" r="240" fill="#fbbf24" filter="url(#feat-design_028-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#5b1d28" stroke-width="1" />
  

  <!-- Top Header -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="174" height="30" rx="15" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
    <text x="15" y="20" fill="#ef4444" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      DEFENSE IN DEPTH
    </text>

    
    <text x="0" y="65" fill="#ffffff" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Global Threat Correlation Platform</tspan>
    </text>
  
  </g>

  <!-- Left Hero Bento Card -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="500" height="410" rx="20" fill="url(#feat-design_028-card-grad)" stroke="#5b1d28" stroke-width="1.5" filter="url(#feat-design_028-shadow)" />
    
    <!-- Hero Icon Bubble -->
    <rect x="40" y="40" width="64" height="64" rx="16" fill="url(#feat-design_028-primary-grad)" />
    
    <g transform="translate(56, 56)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <svg width="32" height="32" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  

    <!-- Tag Pill -->
    <rect x="120" y="58" width="130" height="26" rx="13" fill="#ef4444" fill-opacity="0.15" />
    <text x="185" y="75" fill="#ef4444" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1">
      PROACTIVE DEFENSE
    </text>

    <!-- Hero Title -->
    <text x="40" y="160" fill="#ffffff" font-size="28" font-weight="800" font-family="Inter, sans-serif">
      Autonomous Honeypot Network
    </text>

    <!-- Hero Body -->
    
    <text x="40" y="200" fill="#fecaca" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="40" dy="0">Global mesh of sensor nodes capturing</tspan><tspan x="40" dy="28">zero-day exploitation attempts and</tspan><tspan x="40" dy="28">instantly distributing signature</tspan><tspan x="40" dy="28">mitigations worldwide.</tspan>
    </text>
  

    <!-- Bottom Indicator -->
    <g transform="translate(40, 345)">
      <circle cx="6" cy="6" r="6" fill="#fbbf24" />
      <text x="22" y="10" fill="#ffffff" font-size="13" font-weight="600" font-family="Inter, sans-serif">
        Enterprise Standard Production Module
      </text>
    </g>
  </g>

  <!-- Right Stacked 2 Bento Cards -->
  <g transform="translate(610, 160)">
    
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="510" height="195" rx="18" fill="url(#feat-design_028-card-grad)" stroke="#5b1d28" stroke-width="1.5" filter="url(#feat-design_028-shadow)" />
          
          <!-- Icon Bubble -->
          <rect x="30" y="30" width="48" height="48" rx="12" fill="#ef4444" fill-opacity="0.15" />
          
    <g transform="translate(42, 42)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  
      </svg>
    </g>
  

          <!-- Title -->
          <text x="95" y="60" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            AI Phishing Deconstruction
          </text>

          <!-- Description -->
          
    <text x="30" y="110" fill="#fecaca" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="30" dy="0">Deep lexical analysis of spoofed sender</tspan><tspan x="30" dy="24">domains.</tspan>
    </text>
  
        </g>
      
        <g transform="translate(0, 215)">
          <rect x="0" y="0" width="510" height="195" rx="18" fill="url(#feat-design_028-card-grad)" stroke="#5b1d28" stroke-width="1.5" filter="url(#feat-design_028-shadow)" />
          
          <!-- Icon Bubble -->
          <rect x="30" y="30" width="48" height="48" rx="12" fill="#ef4444" fill-opacity="0.15" />
          
    <g transform="translate(42, 42)" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polyline points="16 18 22 12 16 6"/>
    <polyline points="8 6 2 12 8 18"/>
  
      </svg>
    </g>
  

          <!-- Title -->
          <text x="95" y="60" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Supply Chain SBOM Scanner
          </text>

          <!-- Description -->
          
    <text x="30" y="110" fill="#fecaca" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="30" dy="0">Real-time dependency auditing across</tspan><tspan x="30" dy="24">production repos.</tspan>
    </text>
  
        </g>
      
  </g>
</svg>