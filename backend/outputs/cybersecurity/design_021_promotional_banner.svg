<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Modern Zero-Trust Defense">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="promo-design_021-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#09090b" />
        <stop offset="100%" stop-color="#18181b" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="promo-design_021-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="100%" stop-color="#f43f5e" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="promo-design_021-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#18181b" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="promo-design_021-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="promo-design_021-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="promo-design_021-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#06b6d4" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  <defs>
    <!-- Hard Boundary ClipPath for Left Column to prevent any collision with right card -->
    <clipPath id="promo-design_021-left-clip">
      <rect x="0" y="0" width="560" height="460" />
    </clipPath>
  </defs>
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#promo-design_021-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#promo-design_021-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#06b6d4" filter="url(#promo-design_021-glow)" />
      <circle cx="60" cy="567" r="240" fill="#f43f5e" filter="url(#promo-design_021-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#27272a" stroke-width="1" />
  

  <!-- Left Content Column with strict clipPath boundary -->
  <g transform="translate(80, 85)" clip-path="url(#promo-design_021-left-clip)">
    <!-- Category Badge (Dynamic width with safe padding) -->
    <rect x="0" y="0" width="176" height="32" rx="16" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
    <text x="18" y="21" fill="#06b6d4" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.2">
      CLOUD SECURITY
    </text>

    <!-- Main Headline (Tight maxChars: 19 guarantees zero collision with right card) -->
    
    <text x="0" y="72" fill="#fafafa" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Modern Zero-Trust</tspan><tspan x="0" dy="46">Defense</tspan>
    </text>
  

    <!-- Subtitle / Body Copy -->
    
    <text x="0" y="220" fill="#a1a1aa" font-size="15" font-weight="400" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Continuous identity checks, network</tspan><tspan x="0" dy="24">micro-segmentation, and automated</tspan><tspan x="0" dy="24">incident containment.</tspan>
    </text>
  

    <!-- CTA Button (Dynamic width & calculated icon spacing) -->
    <g transform="translate(0, 325)" filter="url(#promo-design_021-shadow)">
      <rect x="0" y="0" width="297.5" height="50" rx="25" fill="url(#promo-design_021-primary-grad)" />
      <text x="132.75" y="31" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
        Schedule Security Audit
      </text>
      
    <g transform="translate(261.5, 15)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <line x1="5" x2="19" y1="12" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  
      </svg>
    </g>
  
    </g>
  </g>

  <!-- Right Visual / Feature Cards Bento -->
  <g transform="translate(680, 105)">
    <!-- Big Decorative Backing Card -->
    <rect x="0" y="0" width="440" height="415" rx="20" fill="url(#promo-design_021-card-grad)" stroke="#27272a" stroke-width="1.5" filter="url(#promo-design_021-shadow)" />
    
    <!-- Feature items -->
    
        <g transform="translate(25, 24)">
          <rect x="0" y="0" width="390" height="104" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
          
          <!-- Icon Bubble -->
          <rect x="18" y="27" width="50" height="50" rx="12" fill="#06b6d4" fill-opacity="0.15" />
          
    <g transform="translate(31, 40)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  
          
          <!-- Feature Title -->
          <text x="82" y="38" fill="#fafafa" font-size="16" font-weight="700" font-family="Inter, sans-serif">
            Real-Time Inspection
          </text>
          
          <!-- Feature Description (Wrapped dynamically to stay inside card) -->
          
    <text x="82" y="60" fill="#a1a1aa" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="82" dy="0">Kernel-level monitoring without</tspan><tspan x="82" dy="18">slowing user traffic</tspan>
    </text>
  
        </g>
      
        <g transform="translate(25, 148)">
          <rect x="0" y="0" width="390" height="104" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
          
          <!-- Icon Bubble -->
          <rect x="18" y="27" width="50" height="50" rx="12" fill="#06b6d4" fill-opacity="0.15" />
          
    <g transform="translate(31, 40)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  
      </svg>
    </g>
  
          
          <!-- Feature Title -->
          <text x="82" y="38" fill="#fafafa" font-size="16" font-weight="700" font-family="Inter, sans-serif">
            Identity First
          </text>
          
          <!-- Feature Description (Wrapped dynamically to stay inside card) -->
          
    <text x="82" y="60" fill="#a1a1aa" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="82" dy="0">Hardware security keys and biometric</tspan><tspan x="82" dy="18">multi-factor authentication</tspan>
    </text>
  
        </g>
      
        <g transform="translate(25, 272)">
          <rect x="0" y="0" width="390" height="104" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
          
          <!-- Icon Bubble -->
          <rect x="18" y="27" width="50" height="50" rx="12" fill="#06b6d4" fill-opacity="0.15" />
          
    <g transform="translate(31, 40)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  
      </svg>
    </g>
  
          
          <!-- Feature Title -->
          <text x="82" y="38" fill="#fafafa" font-size="16" font-weight="700" font-family="Inter, sans-serif">
            Instant Containment
          </text>
          
          <!-- Feature Description (Wrapped dynamically to stay inside card) -->
          
    <text x="82" y="60" fill="#a1a1aa" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="82" dy="0">Isolates compromised devices</tspan><tspan x="82" dy="18">automatically in seconds</tspan>
    </text>
  
        </g>
      
  </g>
</svg>