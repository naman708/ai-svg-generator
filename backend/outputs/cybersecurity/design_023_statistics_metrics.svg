<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Security Operations Benchmarks">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="stats-design_023-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#09090b" />
        <stop offset="100%" stop-color="#18181b" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="stats-design_023-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#06b6d4" />
        <stop offset="100%" stop-color="#f43f5e" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="stats-design_023-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#18181b" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#18181b" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="stats-design_023-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="stats-design_023-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="stats-design_023-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#06b6d4" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#stats-design_023-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#stats-design_023-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#06b6d4" filter="url(#stats-design_023-glow)" />
      <circle cx="60" cy="567" r="240" fill="#f43f5e" filter="url(#stats-design_023-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#27272a" stroke-width="1" />
  

  <!-- Header Banner -->
  <g transform="translate(80, 70)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="165" height="30" rx="15" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5" />
    <text x="15" y="20" fill="#06b6d4" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      DEFENSE METRICS
    </text>

    <!-- Headline -->
    
    <text x="0" y="65" fill="#fafafa" font-size="40" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Security Operations Benchmarks</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="110" fill="#a1a1aa" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Real performance gains reported after automating security operations and</tspan><tspan x="0" dy="24">incident triage.</tspan>
    </text>
  
  </g>

  <!-- 3 Metric Cards Grid -->
  <g transform="translate(80, 230)">
    
        <g transform="translate(0, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_023-card-grad)" stroke="#27272a" stroke-width="1.5" filter="url(#stats-design_023-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1" />
            <text x="225" y="24" fill="#f43f5e" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              -96% Latency
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#fafafa" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            42 Sec
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#06b6d4" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Mean Time to Detect
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#27272a" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#a1a1aa" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Automated correlation flags</tspan><tspan x="24" dy="20">anomalies across cloud logs</tspan><tspan x="24" dy="20">instantly</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#06b6d4" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#06b6d4" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#06b6d4" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#f43f5e" />
          </g>
        </g>
      
        <g transform="translate(360, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_023-card-grad)" stroke="#27272a" stroke-width="1.5" filter="url(#stats-design_023-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1" />
            <text x="225" y="24" fill="#f43f5e" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              +8.2% Accuracy
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#fafafa" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            99.9%
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#06b6d4" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Phishing Block Rate
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#27272a" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#a1a1aa" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Smart linguistic filters block</tspan><tspan x="24" dy="20">suspicious email attachments and</tspan><tspan x="24" dy="20">links</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#06b6d4" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#06b6d4" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#06b6d4" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#f43f5e" />
          </g>
        </g>
      
        <g transform="translate(720, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_023-card-grad)" stroke="#27272a" stroke-width="1.5" filter="url(#stats-design_023-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#06b6d4" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#f43f5e" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1" />
            <text x="225" y="24" fill="#f43f5e" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              100% Protected
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#fafafa" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            0
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#06b6d4" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Ransomware Breaches
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#27272a" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#a1a1aa" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Zero lateral compromises across</tspan><tspan x="24" dy="20">protected production fleets</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#06b6d4" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#06b6d4" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#06b6d4" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#f43f5e" />
          </g>
        </g>
      
  </g>
</svg>