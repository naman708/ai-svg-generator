<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" role="img" aria-label="The Anatomy of Ransomware">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="edu-design_022-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#180c0e" />
        <stop offset="100%" stop-color="#2d1217" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="edu-design_022-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ef4444" />
        <stop offset="100%" stop-color="#fbbf24" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="edu-design_022-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#3f141c" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#3f141c" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="edu-design_022-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="edu-design_022-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="edu-design_022-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#ef4444" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="800" height="1200" fill="url(#edu-design_022-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="800" height="1200" fill="url(#edu-design_022-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="720" cy="120" r="200" fill="#ef4444" filter="url(#edu-design_022-glow)" />
      <circle cx="40" cy="1080" r="160" fill="#fbbf24" filter="url(#edu-design_022-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="799" height="1199" rx="8" fill="none" stroke="#5b1d28" stroke-width="1" />
  

  <!-- Header Section -->
  <g transform="translate(60, 60)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="201" height="30" rx="15" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
    <text x="15" y="20" fill="#ef4444" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      THREAT INTELLIGENCE
    </text>

    <!-- Main Title -->
    
    <text x="0" y="65" fill="#ffffff" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">The Anatomy of Ransomware</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="165" fill="#fecaca" font-size="16" font-weight="400" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">How modern ransomware attacks unfold from initial foothold to</tspan><tspan x="0" dy="24">extortion demand.</tspan>
    </text>
  
    
    <!-- Dividing Accent Line -->
    <line x1="0" y1="220" x2="680" y2="220" stroke="#5b1d28" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- Educational Concept Cards (4 Stacked) -->
  <g transform="translate(60, 310)">
    
        <g transform="translate(0, 0)">
          <!-- Card Container -->
          <rect x="0" y="0" width="680" height="170" rx="16" fill="url(#edu-design_022-card-grad)" stroke="#5b1d28" stroke-width="1.5" filter="url(#edu-design_022-shadow)" />
          
          <!-- Number Badge -->
          <rect x="25" y="25" width="48" height="48" rx="12" fill="#ef4444" />
          <text x="49" y="55" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            01
          </text>

          <!-- Card Header & Icon -->
          <text x="95" y="54" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Initial Compromise
          </text>
          
    <g transform="translate(615, 30)" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="26" height="26" viewBox="0 0 24 24">
        
    <rect width="18" height="11" x="3" y="11" rx="2" ry="2"/>
    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
  
      </svg>
    </g>
  

          <!-- Card Body Description -->
          
    <text x="95" y="95" fill="#fecaca" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="95" dy="0">Spear-phishing or leaked credentials bypass the</tspan><tspan x="95" dy="24">outer perimeter.</tspan>
    </text>
  
        </g>
      
        <g transform="translate(0, 195)">
          <!-- Card Container -->
          <rect x="0" y="0" width="680" height="170" rx="16" fill="url(#edu-design_022-card-grad)" stroke="#5b1d28" stroke-width="1.5" filter="url(#edu-design_022-shadow)" />
          
          <!-- Number Badge -->
          <rect x="25" y="25" width="48" height="48" rx="12" fill="#ef4444" />
          <text x="49" y="55" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            02
          </text>

          <!-- Card Header & Icon -->
          <text x="95" y="54" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Lateral Movement
          </text>
          
    <g transform="translate(615, 30)" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="26" height="26" viewBox="0 0 24 24">
        
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  
      </svg>
    </g>
  

          <!-- Card Body Description -->
          
    <text x="95" y="95" fill="#fecaca" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="95" dy="0">Attackers move quietly between internal systems to</tspan><tspan x="95" dy="24">escalate privileges.</tspan>
    </text>
  
        </g>
      
        <g transform="translate(0, 390)">
          <!-- Card Container -->
          <rect x="0" y="0" width="680" height="170" rx="16" fill="url(#edu-design_022-card-grad)" stroke="#5b1d28" stroke-width="1.5" filter="url(#edu-design_022-shadow)" />
          
          <!-- Number Badge -->
          <rect x="25" y="25" width="48" height="48" rx="12" fill="#ef4444" />
          <text x="49" y="55" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            03
          </text>

          <!-- Card Header & Icon -->
          <text x="95" y="54" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Data Exfiltration
          </text>
          
    <g transform="translate(615, 30)" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="26" height="26" viewBox="0 0 24 24">
        
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
    <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
  
      </svg>
    </g>
  

          <!-- Card Body Description -->
          
    <text x="95" y="95" fill="#fecaca" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="95" dy="0">Sensitive customer records are quietly copied to</tspan><tspan x="95" dy="24">remote servers.</tspan>
    </text>
  
        </g>
      
        <g transform="translate(0, 585)">
          <!-- Card Container -->
          <rect x="0" y="0" width="680" height="170" rx="16" fill="url(#edu-design_022-card-grad)" stroke="#5b1d28" stroke-width="1.5" filter="url(#edu-design_022-shadow)" />
          
          <!-- Number Badge -->
          <rect x="25" y="25" width="48" height="48" rx="12" fill="#ef4444" />
          <text x="49" y="55" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            04
          </text>

          <!-- Card Header & Icon -->
          <text x="95" y="54" fill="#ffffff" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Payload Detonation
          </text>
          
    <g transform="translate(615, 30)" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="26" height="26" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <line x1="12" x2="12" y1="8" y2="12"/>
    <line x1="12" x2="12.01" y1="16" y2="16"/>
  
      </svg>
    </g>
  

          <!-- Card Body Description -->
          
    <text x="95" y="95" fill="#fecaca" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="95" dy="0">Local backups are deleted and strong encryption</tspan><tspan x="95" dy="24">locks all critical disks.</tspan>
    </text>
  
        </g>
      
  </g>

  <!-- Footer Info -->
  <g transform="translate(60, 1130)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#5b1d28" stroke-width="1" />
    <text x="0" y="32" fill="#fecaca" font-size="13" font-family="Inter, sans-serif">
      AI-Powered Vector Infographic Engine • Generated Visual Guide
    </text>
    <text x="680" y="32" fill="#ef4444" font-size="13" font-weight="600" text-anchor="end" font-family="Inter, sans-serif">
      Open Standards • Production Ready
    </text>
  </g>
</svg>