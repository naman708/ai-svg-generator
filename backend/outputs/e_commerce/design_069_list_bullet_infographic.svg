          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#fafaf9" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Add Trusted Payment Badges</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#d6d3d1" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Display recognizable security logos next to the</tspan><tspan x="0" dy="22">payment button.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 620)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_069-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#list-design_069-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#f59e0b" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            5
          </text>

          <!-- Row Content -->
          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#fafaf9" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Keep Form Fields Minimal</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#d6d3d1" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Only ask for essential shipping details to reduce</tspan><tspan x="0" dy="22">checkout fatigue.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
        </g>
      
  </g>

  <!-- Footer -->
  <g transform="translate(60, 1130)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#44403c" stroke-width="1" />
    <text x="0" y="32" fill="#d6d3d1" font-size="13" font-family="Inter, sans-serif">
      Synthesized Vector Framework • Shri Genesis AI Technical Assessment
    </text>
    <text x="680" y="32" fill="#f59e0b" font-size="13" font-weight="600" text-anchor="end" font-family="Inter, sans-serif">
      100% Vector Scalable
    </text>
  </g>
</svg>