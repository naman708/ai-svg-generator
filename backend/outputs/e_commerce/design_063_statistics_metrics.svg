<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Cyber Week Enterprise Benchmarks">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="stats-design_063-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1c1917" />
        <stop offset="100%" stop-color="#292524" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="stats-design_063-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#fde68a" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="stats-design_063-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#292524" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#292524" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="stats-design_063-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="stats-design_063-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="stats-design_063-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#f59e0b" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#stats-design_063-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#stats-design_063-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#f59e0b" filter="url(#stats-design_063-glow)" />
      <circle cx="60" cy="567" r="240" fill="#fde68a" filter="url(#stats-design_063-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#44403c" stroke-width="1" />
  

  <!-- Header Banner -->
  <g transform="translate(80, 70)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="174" height="30" rx="15" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="20" fill="#f59e0b" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      RETAIL ANALYTICS
    </text>

    <!-- Headline -->
    
    <text x="0" y="65" fill="#fafaf9" font-size="40" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Cyber Week Enterprise Benchmarks</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="110" fill="#d6d3d1" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Global transaction volumes and conversion benchmarks recorded across headless</tspan><tspan x="0" dy="24">retail storefronts.</tspan>
    </text>
  
  </g>

  <!-- 3 Metric Cards Grid -->
  <g transform="translate(80, 230)">
    
        <g transform="translate(0, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_063-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#stats-design_063-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#fde68a" fill-opacity="0.2" stroke="#fde68a" stroke-width="1" />
            <text x="225" y="24" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              +38% vs Industry
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#fafaf9" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            4.85%
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#f59e0b" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Mobile Checkout Conversion
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#44403c" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Accelerated page load times and</tspan><tspan x="24" dy="20">biometrics checkout</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#f59e0b" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#f59e0b" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#f59e0b" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#fde68a" />
          </g>
        </g>
      
        <g transform="translate(360, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_063-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#stats-design_063-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <line x1="12" x2="12" y1="2" y2="22"/>
    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#fde68a" fill-opacity="0.2" stroke="#fde68a" stroke-width="1" />
            <text x="225" y="24" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              +24% YoY
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#fafaf9" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            $142
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#f59e0b" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Average Order Value
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#44403c" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">AI-driven algorithmic</tspan><tspan x="24" dy="20">cross-sells at cart review</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#f59e0b" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#f59e0b" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#f59e0b" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#fde68a" />
          </g>
        </g>
      
        <g transform="translate(720, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_063-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#stats-design_063-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#fde68a" fill-opacity="0.2" stroke="#fde68a" stroke-width="1" />
            <text x="225" y="24" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              Zero Dropped Carts
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#fafaf9" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            99.999%
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#f59e0b" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Peak Uptime Resilience
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#44403c" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Elastic auto-scaling edge</tspan><tspan x="24" dy="20">infrastructure</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#f59e0b" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#f59e0b" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#f59e0b" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#fde68a" />
          </g>
        </g>
      
  </g>
</svg>