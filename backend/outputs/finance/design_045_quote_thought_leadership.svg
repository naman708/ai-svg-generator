<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The big money is not in the buying and the selling, but in the waiting. Time in the market always beats timing the market.">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="quote-design_045-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1c1917" />
        <stop offset="100%" stop-color="#292524" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="quote-design_045-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#fde68a" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="quote-design_045-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#292524" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#292524" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="quote-design_045-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="quote-design_045-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="quote-design_045-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#f59e0b" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#quote-design_045-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#quote-design_045-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#f59e0b" filter="url(#quote-design_045-glow)" />
      <circle cx="60" cy="567" r="240" fill="#fde68a" filter="url(#quote-design_045-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#44403c" stroke-width="1" />
  

  <!-- Central Card -->
  <g transform="translate(100, 75)">
    <rect x="0" y="0" width="1000" height="480" rx="24" fill="url(#quote-design_045-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#quote-design_045-shadow)" />

    <!-- Top Badge -->
    <g transform="translate(60, 50)">
      <rect x="0" y="0" width="174" height="30" rx="15" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
      <text x="15" y="20" fill="#f59e0b" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
        INVESTING WISDOM
      </text>
    </g>

    <!-- Large Decorative Quote Glyph -->
    <g transform="translate(60, 110)">
      
    <g transform="translate(0, 0)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="48" height="48" viewBox="0 0 24 24">
        
    <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/>
    <path d="M15 21c3 0 7-1 7-8V5c0-1.25-.757-2.017-2-2h-4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z"/>
  
      </svg>
    </g>
  
    </g>

    <!-- Quote Body -->
    <g transform="translate(60, 180)">
      
    <text x="0" y="20" fill="#fafaf9" font-size="32" font-weight="600" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">“The big money is not in the buying and the</tspan><tspan x="0" dy="44">selling, but in the waiting. Time in the</tspan><tspan x="0" dy="44">market always beats timing the market.”</tspan>
    </text>
  
    </g>

    <!-- Author Profile Footer -->
    <g transform="translate(60, 390)">
      <!-- Avatar Circle with Initial -->
      <circle cx="28" cy="28" r="28" fill="#f59e0b" />
      <text x="28" y="37" fill="#ffffff" font-size="22" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
        C
      </text>

      <!-- Author Name & Verified Badge -->
      <text x="75" y="24" fill="#fafaf9" font-size="20" font-weight="700" font-family="Inter, sans-serif">
        Charlie Munger
      </text>
      
    <g transform="translate(239, 8)" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="18" height="18" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  

      <!-- Role / Title -->
      <text x="75" y="46" fill="#d6d3d1" font-size="14" font-family="Inter, sans-serif">
        Legendary Investor &amp; Vice Chairman
      </text>
    </g>
  </g>
</svg>