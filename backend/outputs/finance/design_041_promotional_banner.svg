<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Algorithmic Wealth Optimization">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="promo-design_041-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1c1917" />
        <stop offset="100%" stop-color="#292524" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="promo-design_041-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#fde68a" />
