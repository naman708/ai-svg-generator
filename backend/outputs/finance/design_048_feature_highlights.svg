<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Autonomous Corporate Treasury Engine">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="feat-design_048-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#1e293b" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="feat-design_048-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3b82f6" />
        <stop offset="100%" stop-color="#38bdf8" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="feat-design_048-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="feat-design_048-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="feat-design_048-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="feat-design_048-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#3b82f6" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#feat-design_048-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#feat-design_048-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#3b82f6" filter="url(#feat-design_048-glow)" />
      <circle cx="60" cy="567" r="240" fill="#38bdf8" filter="url(#feat-design_048-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#334155" stroke-width="1" />
  

  <!-- Top Header -->
  <g transform="translate(80, 50)">
    <rect x="0" y="0" width="192" height="30" rx="15" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5" />
    <text x="15" y="20" fill="#3b82f6" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      CORPORATE TREASURY
    </text>

    
    <text x="0" y="65" fill="#f8fafc" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Autonomous Corporate Treasury Engine</tspan>
    </text>
  
  </g>

  <!-- Left Hero Bento Card -->
  <g transform="translate(80, 160)">
    <rect x="0" y="0" width="500" height="410" rx="20" fill="url(#feat-design_048-card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#feat-design_048-shadow)" />
    
    <!-- Hero Icon Bubble -->
    <rect x="40" y="40" width="64" height="64" rx="16" fill="url(#feat-design_048-primary-grad)" />
    
    <g transform="translate(56, 56)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <svg width="32" height="32" viewBox="0 0 24 24">
        
    <line x1="12" x2="12" y1="2" y2="22"/>
    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
  
      </svg>
    </g>
  

    <!-- Tag Pill -->
    <rect x="120" y="58" width="130" height="26" rx="13" fill="#3b82f6" fill-opacity="0.15" />
    <text x="185" y="75" fill="#3b82f6" font-size="11" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1">
      CASH AUTOMATION
    </text>

    <!-- Hero Title -->
    <text x="40" y="160" fill="#f8fafc" font-size="28" font-weight="800" font-family="Inter, sans-serif">
      Yield Curve Optimization
    </text>

    <!-- Hero Body -->
    
    <text x="40" y="200" fill="#94a3b8" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="40" dy="0">Dynamically sweeps corporate balances</tspan><tspan x="40" dy="28">into overnight repo and short-duration</tspan><tspan x="40" dy="28">T-bills to maximize yield while</tspan><tspan x="40" dy="28">preserving instant liquidity.</tspan>
    </text>
  

    <!-- Bottom Indicator -->
    <g transform="translate(40, 345)">
      <circle cx="6" cy="6" r="6" fill="#38bdf8" />
      <text x="22" y="10" fill="#f8fafc" font-size="13" font-weight="600" font-family="Inter, sans-serif">
        Enterprise Standard Production Module
      </text>
    </g>
  </g>

  <!-- Right Stacked 2 Bento Cards -->
  <g transform="translate(610, 160)">
    
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="510" height="195" rx="18" fill="url(#feat-design_048-card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#feat-design_048-shadow)" />
          
          <!-- Icon Bubble -->
          <rect x="30" y="30" width="48" height="48" rx="12" fill="#3b82f6" fill-opacity="0.15" />
          
    <g transform="translate(42, 42)" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/>
    <path d="M2 12h20"/>
  
      </svg>
    </g>
  

          <!-- Title -->
          <text x="95" y="60" fill="#f8fafc" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Real-Time FX Hedging
          </text>

          <!-- Description -->
          
    <text x="30" y="110" fill="#94a3b8" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="30" dy="0">Automate cross-currency forward contracts.</tspan>
    </text>
  
        </g>
      
        <g transform="translate(0, 215)">
          <rect x="0" y="0" width="510" height="195" rx="18" fill="url(#feat-design_048-card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#feat-design_048-shadow)" />
          
          <!-- Icon Bubble -->
          <rect x="30" y="30" width="48" height="48" rx="12" fill="#3b82f6" fill-opacity="0.15" />
          
    <g transform="translate(42, 42)" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
  
      </svg>
    </g>
  

          <!-- Title -->
          <text x="95" y="60" fill="#f8fafc" font-size="22" font-weight="700" font-family="Inter, sans-serif">
            Multi-Entity Sweep Accounts
          </text>

          <!-- Description -->
          
    <text x="30" y="110" fill="#94a3b8" font-size="15" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="30" dy="0">Consolidate global subsidiaries into single</tspan><tspan x="30" dy="24">ledger view.</tspan>
    </text>
  
        </g>
      
  </g>
</svg>