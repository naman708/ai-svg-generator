  </g>

  <!-- Central "VS" Badge -->
  <g transform="translate(580, 340)">
    <circle cx="20" cy="20" r="28" fill="#1c1917" stroke="#f59e0b" stroke-width="2" filter="url(#comp-design_047-shadow)" />
    <text x="20" y="27" fill="#fafaf9" font-size="16" font-weight="900" text-anchor="middle" font-family="Inter, sans-serif">
