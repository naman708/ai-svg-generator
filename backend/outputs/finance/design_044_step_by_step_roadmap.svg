<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The 4 Milestones to Financial Freedom">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="steps-design_044-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1c1917" />
        <stop offset="100%" stop-color="#292524" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="steps-design_044-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#fde68a" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="steps-design_044-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#292524" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#292524" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="steps-design_044-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="steps-design_044-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="steps-design_044-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#f59e0b" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#steps-design_044-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#steps-design_044-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#f59e0b" filter="url(#steps-design_044-glow)" />
      <circle cx="60" cy="567" r="240" fill="#fde68a" filter="url(#steps-design_044-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#44403c" stroke-width="1" />
  

  <!-- Header Section -->
  <g transform="translate(80, 65)">
    <rect x="0" y="0" width="186" height="30" rx="15" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="93" y="20" fill="#f59e0b" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1.2">
      WEALTH ROADMAP
    </text>

    <!-- Main Title -->
    
    <text x="0" y="65" fill="#fafaf9" font-size="38" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">The 4 Milestones to Financial Freedom</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="110" fill="#d6d3d1" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">A clear, quantitative roadmap to escape the paycheck cycle and build</tspan><tspan x="0" dy="24">generational security.</tspan>
    </text>
  
  </g>

  <!-- Horizontal Connector Line between Nodes -->
  <line x1="180" y1="260" x2="1020" y2="260" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6 6" opacity="0.6" />

  <!-- 4 Step Cards -->
  <g transform="translate(80, 210)">
    
        <g transform="translate(0, 0)">
          <!-- Circular Node Pin on the connecting line -->
          <circle cx="115" cy="50" r="28" fill="#1c1917" stroke="#f59e0b" stroke-width="3" filter="url(#steps-design_044-shadow)" />
          <text x="115" y="56" fill="#f59e0b" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            01
          </text>

          <!-- Step Card Container below the node -->
          <g transform="translate(0, 100)">
            <rect x="0" y="0" width="230" height="220" rx="16" fill="url(#steps-design_044-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#steps-design_044-shadow)" />
            
            <!-- Icon Wrapper -->
            <rect x="20" y="20" width="44" height="44" rx="10" fill="#f59e0b" fill-opacity="0.15" />
            
    <g transform="translate(30, 30)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  

            <!-- Step Title (Safely bounded) -->
            
    <text x="20" y="95" fill="#fafaf9" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Emergency Fund</tspan>
    </text>
  

            <!-- Step Description -->
            
    <text x="20" y="125" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Save 3 to 6 months of</tspan><tspan x="20" dy="22">essential living</tspan><tspan x="20" dy="22">expenses in an insured</tspan><tspan x="20" dy="22">account.</tspan>
    </text>
  
          </g>
        </g>
      
        <g transform="translate(265, 0)">
          <!-- Circular Node Pin on the connecting line -->
          <circle cx="115" cy="50" r="28" fill="#1c1917" stroke="#f59e0b" stroke-width="3" filter="url(#steps-design_044-shadow)" />
          <text x="115" y="56" fill="#f59e0b" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            02
          </text>

          <!-- Step Card Container below the node -->
          <g transform="translate(0, 100)">
            <rect x="0" y="0" width="230" height="220" rx="16" fill="url(#steps-design_044-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#steps-design_044-shadow)" />
            
            <!-- Icon Wrapper -->
            <rect x="20" y="20" width="44" height="44" rx="10" fill="#f59e0b" fill-opacity="0.15" />
            
    <g transform="translate(30, 30)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <line x1="12" x2="12" y1="2" y2="22"/>
    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
  
      </svg>
    </g>
  

            <!-- Step Title (Safely bounded) -->
            
    <text x="20" y="95" fill="#fafaf9" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Pay Down Debt</tspan>
    </text>
  

            <!-- Step Description -->
            
    <text x="20" y="125" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Aggressively eliminate</tspan><tspan x="20" dy="22">high-interest consumer</tspan><tspan x="20" dy="22">credit cards and</tspan><tspan x="20" dy="22">personal loans.</tspan>
    </text>
  
          </g>
        </g>
      
        <g transform="translate(530, 0)">
          <!-- Circular Node Pin on the connecting line -->
          <circle cx="115" cy="50" r="28" fill="#1c1917" stroke="#f59e0b" stroke-width="3" filter="url(#steps-design_044-shadow)" />
          <text x="115" y="56" fill="#f59e0b" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            03
          </text>

          <!-- Step Card Container below the node -->
          <g transform="translate(0, 100)">
            <rect x="0" y="0" width="230" height="220" rx="16" fill="url(#steps-design_044-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#steps-design_044-shadow)" />
            
            <!-- Icon Wrapper -->
            <rect x="20" y="20" width="44" height="44" rx="10" fill="#f59e0b" fill-opacity="0.15" />
            
    <g transform="translate(30, 30)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
  
      </svg>
    </g>
  

            <!-- Step Title (Safely bounded) -->
            
    <text x="20" y="95" fill="#fafaf9" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Automate Savings</tspan>
    </text>
  

            <!-- Step Description -->
            
    <text x="20" y="125" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Direct a fixed share</tspan><tspan x="20" dy="22">of every paycheck into</tspan><tspan x="20" dy="22">low-cost index funds.</tspan>
    </text>
  
          </g>
        </g>
      
        <g transform="translate(795, 0)">
          <!-- Circular Node Pin on the connecting line -->
          <circle cx="115" cy="50" r="28" fill="#1c1917" stroke="#f59e0b" stroke-width="3" filter="url(#steps-design_044-shadow)" />
          <text x="115" y="56" fill="#f59e0b" font-size="15" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            04
          </text>

          <!-- Step Card Container below the node -->
          <g transform="translate(0, 100)">
            <rect x="0" y="0" width="230" height="220" rx="16" fill="url(#steps-design_044-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#steps-design_044-shadow)" />
            
            <!-- Icon Wrapper -->
            <rect x="20" y="20" width="44" height="44" rx="10" fill="#f59e0b" fill-opacity="0.15" />
            
    <g transform="translate(30, 30)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="8" r="6"/>
    <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
  
      </svg>
    </g>
  

            <!-- Step Title (Safely bounded) -->
            
    <text x="20" y="95" fill="#fafaf9" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Financial Freedom</tspan>
    </text>
  

            <!-- Step Description -->
            
    <text x="20" y="125" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Cover your living</tspan><tspan x="20" dy="22">costs sustainably from</tspan><tspan x="20" dy="22">investment returns and</tspan><tspan x="20" dy="22">dividends.</tspan>
    </text>
  
          </g>
        </g>
      
  </g>
</svg>