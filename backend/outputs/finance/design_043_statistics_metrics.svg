<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Systematic Macro Fund Highlights">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="stats-design_043-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1c1917" />
        <stop offset="100%" stop-color="#292524" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="stats-design_043-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#fde68a" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="stats-design_043-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#292524" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#292524" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="stats-design_043-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="stats-design_043-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="stats-design_043-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#f59e0b" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#stats-design_043-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#stats-design_043-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#f59e0b" filter="url(#stats-design_043-glow)" />
      <circle cx="60" cy="567" r="240" fill="#fde68a" filter="url(#stats-design_043-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#44403c" stroke-width="1" />
  

  <!-- Header Banner -->
  <g transform="translate(80, 70)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="210" height="30" rx="15" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="15" y="20" fill="#f59e0b" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      PORTFOLIO BENCHMARKS
    </text>

    <!-- Headline -->
    
    <text x="0" y="65" fill="#fafaf9" font-size="40" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Systematic Macro Fund Highlights</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="110" fill="#d6d3d1" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Audited financial performance metrics across multi-year global macro systematic</tspan><tspan x="0" dy="24">strategies.</tspan>
    </text>
  
  </g>

  <!-- 3 Metric Cards Grid -->
  <g transform="translate(80, 230)">
    
        <g transform="translate(0, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_043-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#stats-design_043-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/>
    <polyline points="16 7 22 7 22 13"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#fde68a" fill-opacity="0.2" stroke="#fde68a" stroke-width="1" />
            <text x="225" y="24" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              +11.2% vs S&amp;P
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#fafaf9" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            24.6%
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#f59e0b" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Annualized Net IRR
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#44403c" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Market-neutral non-correlated</tspan><tspan x="24" dy="20">quantitative returns</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#f59e0b" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#f59e0b" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#f59e0b" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#fde68a" />
          </g>
        </g>
      
        <g transform="translate(360, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_043-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#stats-design_043-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="8" r="6"/>
    <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#fde68a" fill-opacity="0.2" stroke="#fde68a" stroke-width="1" />
            <text x="225" y="24" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              Top Decile
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#fafaf9" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            2.35
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#f59e0b" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Sharpe Ratio
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#44403c" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Superior risk-adjusted capital</tspan><tspan x="24" dy="20">preservation ratio</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#f59e0b" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#f59e0b" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#f59e0b" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#fde68a" />
          </g>
        </g>
      
        <g transform="translate(720, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_043-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#stats-design_043-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <line x1="12" x2="12" y1="2" y2="22"/>
    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#fde68a" fill-opacity="0.2" stroke="#fde68a" stroke-width="1" />
            <text x="225" y="24" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              +45% YoY Inflows
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#fafaf9" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            $2.4B
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#f59e0b" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Assets Under Management
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#44403c" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#d6d3d1" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Institutional capital committed</tspan><tspan x="24" dy="20">across global pensions</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#f59e0b" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#f59e0b" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#f59e0b" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#fde68a" />
          </g>
        </g>
      
  </g>
</svg>