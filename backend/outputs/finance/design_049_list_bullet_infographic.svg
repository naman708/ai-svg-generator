          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#0f172a" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Never Risk What You Cannot Afford T...</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Prioritize capital preservation over speculative</tspan><tspan x="0" dy="22">upside.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 155)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_049-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_049-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            2
          </text>

          <!-- Row Content -->
          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#0f172a" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Diversify Across Uncorrelated Assets</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Combine equities, treasuries, hard assets, and cash.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 310)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_049-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_049-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            3
