      <tspan x="0" dy="0">Expense ratios and high turnover quietly cannibalize</tspan><tspan x="0" dy="22">wealth.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <line x1="12" x2="12" y1="2" y2="22"/>
    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 620)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_049-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_049-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            5
          </text>

          <!-- Row Content -->
          <g transform="translate(90, 24)">
            
    <text x="0" y="22" fill="#0f172a" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Lengthen Your Investment Time Horizon</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#64748b" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Time in the market consistently outplays timing the</tspan><tspan x="0" dy="22">market.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <circle cx="12" cy="12" r="6"/>
    <circle cx="12" cy="12" r="2"/>
  
      </svg>
    </g>
  
        </g>
      
  </g>

  <!-- Footer -->
  <g transform="translate(60, 1130)">
    <line x1="0" y1="0" x2="680" y2="0" stroke="#cbd5e1" stroke-width="1" />
    <text x="0" y="32" fill="#64748b" font-size="13" font-family="Inter, sans-serif">
      Synthesized Vector Framework • Shri Genesis AI Technical Assessment
    </text>
    <text x="680" y="32" fill="#2563eb" font-size="13" font-weight="600" text-anchor="end" font-family="Inter, sans-serif">
