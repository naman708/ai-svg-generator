      <circle cx="40" cy="1080" r="160" fill="#fde68a" filter="url(#list-design_049-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="799" height="1199" rx="8" fill="none" stroke="#44403c" stroke-width="1" />
  

  <!-- Header Banner -->
  <g transform="translate(60, 60)">
