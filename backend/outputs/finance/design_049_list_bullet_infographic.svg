<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" role="img" aria-label="5 Principles of Resilient Portfolios">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="list-design_049-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc" />
        <stop offset="100%" stop-color="#e2e8f0" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="list-design_049-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#4f46e5" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="list-design_049-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="list-design_049-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="list-design_049-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="list-design_049-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#2563eb" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="800" height="1200" fill="url(#list-design_049-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="800" height="1200" fill="url(#list-design_049-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="720" cy="120" r="200" fill="#2563eb" filter="url(#list-design_049-glow)" />
      <circle cx="40" cy="1080" r="160" fill="#4f46e5" filter="url(#list-design_049-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="799" height="1199" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1" />
  

  <!-- Header Banner -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="197" height="30" rx="15" fill="#2563eb" fill-opacity="0.15" stroke="#2563eb" stroke-width="1.5" />
    <text x="98.5" y="20" fill="#2563eb" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif" letter-spacing="1.2">
      RISK MANAGEMENT
    </text>

    <!-- Main Title -->
    
    <text x="0" y="65" fill="#0f172a" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">5 Principles of Resilient</tspan><tspan x="0" dy="44">Portfolios</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="165" fill="#64748b" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Enduring rules that protect capital across inflationary shocks</tspan><tspan x="0" dy="24">and deflationary crashes.</tspan>
    </text>
  

    <line x1="0" y1="225" x2="680" y2="225" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4" />
  </g>

  <!-- 5 Sequential List Cards -->
  <g transform="translate(60, 315)">
    
        <g transform="translate(0, 0)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_049-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#list-design_049-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#2563eb" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            1
          </text>

