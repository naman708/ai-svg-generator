<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200" role="img" aria-label="5 Principles of Resilient Portfolios">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="list-design_049-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1c1917" />
        <stop offset="100%" stop-color="#292524" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="list-design_049-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="100%" stop-color="#fde68a" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="list-design_049-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#292524" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#292524" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="list-design_049-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="list-design_049-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="list-design_049-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#f59e0b" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="800" height="1200" fill="url(#list-design_049-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="800" height="1200" fill="url(#list-design_049-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
