    <text x="0" y="22" fill="#fafaf9" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Read Across Fields</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#d6d3d1" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">The most creative breakthroughs happen when</tspan><tspan x="0" dy="22">connecting unrelated ideas.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 465)">
