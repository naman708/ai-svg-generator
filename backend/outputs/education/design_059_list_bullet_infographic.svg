    <text x="0" y="22" fill="#fafaf9" font-size="19" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Space Out Your Reviews</tspan>
    </text>
  

            
    <text x="0" y="54" fill="#d6d3d1" font-size="14" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Reviewing material over gradual intervals locks it</tspan><tspan x="0" dy="22">into memory.</tspan>
    </text>
  
          </g>

          <!-- Right Icon -->
          
    <g transform="translate(620, 28)" fill="none" stroke="#fde68a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  
      </svg>
    </g>
  
        </g>
      
        <g transform="translate(0, 310)">
          <rect x="0" y="0" width="680" height="135" rx="16" fill="url(#list-design_059-card-grad)" stroke="#44403c" stroke-width="1.5" filter="url(#list-design_059-shadow)" />
          
          <!-- Number Box -->
          <rect x="24" y="24" width="46" height="46" rx="12" fill="#f59e0b" />
          <text x="47" y="53" fill="#ffffff" font-size="20" font-weight="800" text-anchor="middle" font-family="Inter, sans-serif">
            3
