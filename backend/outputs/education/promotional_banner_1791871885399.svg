<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Master Decentralized Architecture &amp; Smart Contracts">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="promo-s9w15-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#0f172a" />
        <stop offset="100%" stop-color="#1e293b" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="promo-s9w15-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#3b82f6" />
        <stop offset="100%" stop-color="#38bdf8" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="promo-s9w15-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#1e293b" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="promo-s9w15-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="promo-s9w15-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="promo-s9w15-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#3b82f6" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#promo-s9w15-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#promo-s9w15-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#3b82f6" filter="url(#promo-s9w15-glow)" />
      <circle cx="60" cy="567" r="240" fill="#38bdf8" filter="url(#promo-s9w15-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#334155" stroke-width="1" />
  

  <!-- Left Content Column -->
  <g transform="translate(80, 100)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="266" height="32" rx="16" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5" />
    <text x="16" y="21" fill="#3b82f6" font-size="13" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      ACCREDITED WEB3 CURRICULUM
    </text>

    <!-- Main Headline -->
    
    <text x="0" y="75" fill="#f8fafc" font-size="48" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Master Decentralized</tspan><tspan x="0" dy="56">Architecture &amp; Smart...</tspan>
    </text>
  

    <!-- Subtitle / Body Copy -->
    
    <text x="0" y="200" fill="#94a3b8" font-size="18" font-weight="400" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Develop production-grade blockchain solutions</tspan><tspan x="0" dy="28">with industry-leading modules in cryptography,</tspan><tspan x="0" dy="28">consensus mechanics, and protocol security.</tspan>
    </text>
  

    <!-- CTA Button -->
    <g transform="translate(0, 300)" filter="url(#promo-s9w15-shadow)">
      <rect x="0" y="0" width="220" height="52" rx="26" fill="url(#promo-s9w15-primary-grad)" />
      <text x="95" y="32" fill="#ffffff" font-size="16" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
        Explore the Syllabus
      </text>
      
    <g transform="translate(165, 16)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <line x1="5" x2="19" y1="12" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  
      </svg>
    </g>
  
    </g>
  </g>

  <!-- Right Visual / Feature Cards Bento -->
  <g transform="translate(710, 120)">
    <!-- Big Decorative Backing Card -->
    <rect x="0" y="0" width="410" height="390" rx="20" fill="url(#promo-s9w15-card-grad)" stroke="#334155" stroke-width="1.5" filter="url(#promo-s9w15-shadow)" />
    
    <!-- Feature items -->
    
        <g transform="translate(30, 30)">
          <rect x="0" y="0" width="350" height="90" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <!-- Icon Bubble -->
          <rect x="20" y="20" width="50" height="50" rx="12" fill="#3b82f6" fill-opacity="0.15" />
          
    <g transform="translate(33, 33)" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
    <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
  
      </svg>
    </g>
  
          <!-- Feature Title -->
          <text x="85" y="42" fill="#f8fafc" font-size="17" font-weight="700" font-family="Inter, sans-serif">
            Consensus &amp; Ledgers
          </text>
          <!-- Feature Description -->
          <text x="85" y="62" fill="#94a3b8" font-size="13" font-family="Inter, sans-serif">
            Understand core Byzantine fault tolerance, PoS validators, and distributed state machines.
          </text>
        </g>
      
        <g transform="translate(30, 145)">
          <rect x="0" y="0" width="350" height="90" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <!-- Icon Bubble -->
          <rect x="20" y="20" width="50" height="50" rx="12" fill="#3b82f6" fill-opacity="0.15" />
          
    <g transform="translate(33, 33)" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
    <path d="m9 12 2 2 4-4"/>
  
      </svg>
    </g>
  
          <!-- Feature Title -->
          <text x="85" y="42" fill="#f8fafc" font-size="17" font-weight="700" font-family="Inter, sans-serif">
            Contract Security
          </text>
          <!-- Feature Description -->
          <text x="85" y="62" fill="#94a3b8" font-size="13" font-family="Inter, sans-serif">
            Write audit-ready smart contracts with robust defensive programming patterns.
          </text>
        </g>
      
        <g transform="translate(30, 260)">
          <rect x="0" y="0" width="350" height="90" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
          <!-- Icon Bubble -->
          <rect x="20" y="20" width="50" height="50" rx="12" fill="#3b82f6" fill-opacity="0.15" />
          
    <g transform="translate(33, 33)" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <polygon points="12 2 2 7 12 12 22 7 12 2"/>
    <polyline points="2 17 12 22 22 17"/>
    <polyline points="2 12 12 17 22 12"/>
  
      </svg>
    </g>
  
          <!-- Feature Title -->
          <text x="85" y="42" fill="#f8fafc" font-size="17" font-weight="700" font-family="Inter, sans-serif">
            Decentralized Scaling
          </text>
          <!-- Feature Description -->
          <text x="85" y="62" fill="#94a3b8" font-size="13" font-family="Inter, sans-serif">
