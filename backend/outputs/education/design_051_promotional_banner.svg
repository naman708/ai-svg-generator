<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Personalized Tutoring for Every Student">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="promo-design_051-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc" />
        <stop offset="100%" stop-color="#e2e8f0" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="promo-design_051-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#4f46e5" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="promo-design_051-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="promo-design_051-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="promo-design_051-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="promo-design_051-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#2563eb" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  <defs>
    <!-- Hard Boundary ClipPath for Left Column to prevent any collision with right card -->
    <clipPath id="promo-design_051-left-clip">
      <rect x="0" y="0" width="560" height="460" />
    </clipPath>
  </defs>
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#promo-design_051-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#promo-design_051-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#2563eb" filter="url(#promo-design_051-glow)" />
      <circle cx="60" cy="567" r="240" fill="#4f46e5" filter="url(#promo-design_051-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1" />
  

  <!-- Left Content Column with strict clipPath boundary -->
  <g transform="translate(80, 85)" clip-path="url(#promo-design_051-left-clip)">
    <!-- Category Badge (Dynamic width with safe padding) -->
    <rect x="0" y="0" width="206" height="32" rx="16" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5" />
    <text x="18" y="21" fill="#2563eb" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.2">
      ADAPTIVE LEARNING
    </text>

    <!-- Main Headline (Tight maxChars: 19 guarantees zero collision with right card) -->
    
    <text x="0" y="72" fill="#0f172a" font-size="36" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Personalized</tspan><tspan x="0" dy="46">Tutoring for Every</tspan><tspan x="0" dy="46">Student</tspan>
    </text>
  

    <!-- Subtitle / Body Copy -->
    
    <text x="0" y="220" fill="#64748b" font-size="15" font-weight="400" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Master challenging topics through</tspan><tspan x="0" dy="24">friendly, conversational dialogue that</tspan><tspan x="0" dy="24">adapts to your natural learning speed.</tspan>
    </text>
  

    <!-- CTA Button (Dynamic width & calculated icon spacing) -->
    <g transform="translate(0, 325)" filter="url(#promo-design_051-shadow)">
      <rect x="0" y="0" width="255.5" height="50" rx="25" fill="url(#promo-design_051-primary-grad)" />
      <text x="111.75" y="31" fill="#ffffff" font-size="15" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
        Start Learning Free
      </text>
      
    <g transform="translate(219.5, 15)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <svg width="20" height="20" viewBox="0 0 24 24">
        
    <line x1="5" x2="19" y1="12" y2="12"/>
    <polyline points="12 5 19 12 12 19"/>
  
      </svg>
    </g>
  
    </g>
  </g>

  <!-- Right Visual / Feature Cards Bento -->
  <g transform="translate(680, 105)">
    <!-- Big Decorative Backing Card -->
    <rect x="0" y="0" width="440" height="415" rx="20" fill="url(#promo-design_051-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#promo-design_051-shadow)" />
    
    <!-- Feature items -->
    
        <g transform="translate(25, 24)">
          <rect x="0" y="0" width="390" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
          
          <!-- Icon Bubble -->
          <rect x="18" y="27" width="50" height="50" rx="12" fill="#2563eb" fill-opacity="0.15" />
          
    <g transform="translate(31, 40)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/>
    <path d="M9 18h6"/>
    <path d="M10 22h4"/>
  
      </svg>
    </g>
  
          
          <!-- Feature Title -->
          <text x="82" y="38" fill="#0f172a" font-size="16" font-weight="700" font-family="Inter, sans-serif">
            Socratic Guidance
          </text>
          
          <!-- Feature Description (Wrapped dynamically to stay inside card) -->
          
    <text x="82" y="60" fill="#64748b" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="82" dy="0">Asks thoughtful questions to help</tspan><tspan x="82" dy="18">you find answers yourself</tspan>
    </text>
  
        </g>
      
        <g transform="translate(25, 148)">
          <rect x="0" y="0" width="390" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
          
          <!-- Icon Bubble -->
          <rect x="18" y="27" width="50" height="50" rx="12" fill="#2563eb" fill-opacity="0.15" />
          
    <g transform="translate(31, 40)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
  
      </svg>
    </g>
  
          
          <!-- Feature Title -->
          <text x="82" y="38" fill="#0f172a" font-size="16" font-weight="700" font-family="Inter, sans-serif">
            Instant Practice
          </text>
          
          <!-- Feature Description (Wrapped dynamically to stay inside card) -->
          
    <text x="82" y="60" fill="#64748b" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="82" dy="0">Generates custom exercises matched</tspan><tspan x="82" dy="18">to your current skill level</tspan>
    </text>
  
        </g>
      
        <g transform="translate(25, 272)">
          <rect x="0" y="0" width="390" height="104" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
          
          <!-- Icon Bubble -->
          <rect x="18" y="27" width="50" height="50" rx="12" fill="#2563eb" fill-opacity="0.15" />
          
    <g transform="translate(31, 40)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
          
          <!-- Feature Title -->
          <text x="82" y="38" fill="#0f172a" font-size="16" font-weight="700" font-family="Inter, sans-serif">
            Zero Frustration
          </text>
          
          <!-- Feature Description (Wrapped dynamically to stay inside card) -->
          
    <text x="82" y="60" fill="#64748b" font-size="12" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="82" dy="0">Breaks down tricky concepts into</tspan><tspan x="82" dy="18">manageable, easy pieces</tspan>
    </text>
  
        </g>
      
  </g>
</svg>