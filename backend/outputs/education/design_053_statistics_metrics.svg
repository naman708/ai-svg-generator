<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Interactive Learning Benchmarks">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="stats-design_053-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f8fafc" />
        <stop offset="100%" stop-color="#e2e8f0" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="stats-design_053-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#2563eb" />
        <stop offset="100%" stop-color="#4f46e5" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="stats-design_053-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="stats-design_053-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="stats-design_053-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="stats-design_053-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#2563eb" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#stats-design_053-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#stats-design_053-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#2563eb" filter="url(#stats-design_053-glow)" />
      <circle cx="60" cy="567" r="240" fill="#4f46e5" filter="url(#stats-design_053-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#cbd5e1" stroke-width="1" />
  

  <!-- Header Banner -->
  <g transform="translate(80, 70)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="174" height="30" rx="15" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1.5" />
    <text x="15" y="20" fill="#2563eb" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      STUDENT OUTCOMES
    </text>

    <!-- Headline -->
    
    <text x="0" y="65" fill="#0f172a" font-size="40" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Interactive Learning Benchmarks</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="110" fill="#64748b" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Empirical study evaluating mastery learning cohorts against conventional lecture</tspan><tspan x="0" dy="24">pedagogy.</tspan>
    </text>
  
  </g>

  <!-- 3 Metric Cards Grid -->
  <g transform="translate(80, 230)">
    
        <g transform="translate(0, 0)">
