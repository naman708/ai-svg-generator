<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Active Learning vs Passive Lectures">
  
    <defs>
      <!-- Base Background Linear Gradient -->
      <linearGradient id="stats-design_053-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#06281e" />
        <stop offset="100%" stop-color="#0b3d2e" />
      </linearGradient>

      <!-- Primary Gradient for Accents and Cards -->
      <linearGradient id="stats-design_053-primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#10b981" />
        <stop offset="100%" stop-color="#a7f3d0" />
      </linearGradient>

      <!-- Glass / Surface Card Gradient -->
      <linearGradient id="stats-design_053-card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0e4a38" stop-opacity="0.9" />
        <stop offset="100%" stop-color="#0e4a38" stop-opacity="0.6" />
      </linearGradient>

      <!-- Modern Drop Shadow Filter -->
      <filter id="stats-design_053-shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
        <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
      </filter>

      <!-- Subtle Glow Filter for Accents -->
      <filter id="stats-design_053-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="8" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>

      <!-- Tech Dot Pattern -->
      <pattern id="stats-design_053-dot-grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
        <circle cx="2" cy="2" r="1.2" fill="#10b981" fill-opacity="0.12" />
      </pattern>
    </defs>
  
  
    <!-- Main Canvas Background -->
    <rect width="1200" height="630" fill="url(#stats-design_053-bg-grad)" />

    <!-- Ambient Grid Texture -->
    <rect width="1200" height="630" fill="url(#stats-design_053-dot-grid)" />

    <!-- Ambient Glow Orbs -->
    <g opacity="0.3">
      <circle cx="1080" cy="63" r="300" fill="#10b981" filter="url(#stats-design_053-glow)" />
      <circle cx="60" cy="567" r="240" fill="#a7f3d0" filter="url(#stats-design_053-glow)" />
    </g>

    <!-- Border Accent Line -->
    <rect x="0.5" y="0.5" width="1199" height="629" rx="8" fill="none" stroke="#145a44" stroke-width="1" />
  

  <!-- Header Banner -->
  <g transform="translate(80, 70)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="147" height="30" rx="15" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1.5" />
    <text x="15" y="20" fill="#10b981" font-size="12" font-weight="700" font-family="Inter, sans-serif" letter-spacing="1.5">
      STUDY RESULTS
    </text>

    <!-- Headline -->
    
    <text x="0" y="65" fill="#f0fdf4" font-size="40" font-weight="800" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Active Learning vs Passive Lectures</tspan>
    </text>
  

    <!-- Subtitle -->
    
    <text x="0" y="110" fill="#a7f3d0" font-size="16" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="0" dy="0">Research outcomes comparing active, project-based learning with traditional</tspan><tspan x="0" dy="24">classroom lectures.</tspan>
    </text>
  
  </g>

  <!-- 3 Metric Cards Grid -->
  <g transform="translate(80, 230)">
    
        <g transform="translate(0, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_053-card-grad)" stroke="#145a44" stroke-width="1.5" filter="url(#stats-design_053-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
    <path d="M12 5v14"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#a7f3d0" fill-opacity="0.2" stroke="#a7f3d0" stroke-width="1" />
            <text x="225" y="24" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              Tested at 6 Months
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#f0fdf4" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            3.4x
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#10b981" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Concept Retention
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#145a44" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#a7f3d0" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Students who build real hands-on</tspan><tspan x="24" dy="20">projects retain core ideas far</tspan><tspan x="24" dy="20">longer</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#10b981" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#10b981" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#10b981" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#a7f3d0" />
          </g>
        </g>
      
        <g transform="translate(360, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_053-card-grad)" stroke="#145a44" stroke-width="1.5" filter="url(#stats-design_053-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
    <polyline points="22 4 12 14.01 9 11.01"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#a7f3d0" fill-opacity="0.2" stroke="#a7f3d0" stroke-width="1" />
            <text x="225" y="24" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              +45% vs Average
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#f0fdf4" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            68%
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#10b981" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Course Completion
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#145a44" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#a7f3d0" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Interactive cohorts finish</tspan><tspan x="24" dy="20">courses at significantly higher</tspan><tspan x="24" dy="20">rates</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#10b981" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#10b981" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#10b981" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#a7f3d0" />
          </g>
        </g>
      
        <g transform="translate(720, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_053-card-grad)" stroke="#145a44" stroke-width="1.5" filter="url(#stats-design_053-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <circle cx="12" cy="8" r="6"/>
    <path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#a7f3d0" fill-opacity="0.2" stroke="#a7f3d0" stroke-width="1" />
            <text x="225" y="24" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              Surveyed Cohorts
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#f0fdf4" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            92%
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#10b981" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            Student Confidence
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#145a44" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#a7f3d0" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Learners feel prepared to apply</tspan><tspan x="24" dy="20">their skills in practical</tspan><tspan x="24" dy="20">workplace tasks</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#10b981" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#10b981" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#10b981" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#a7f3d0" />
          </g>
        </g>
      
  </g>
</svg>