            <rect x="50" y="0" width="55" height="6" rx="3" fill="#2563eb" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#2563eb" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#4f46e5" />
          </g>
        </g>
      
        <g transform="translate(720, 0)">
          <!-- Card Backdrop -->
          <rect x="0" y="0" width="320" height="320" rx="20" fill="url(#stats-design_053-card-grad)" stroke="#cbd5e1" stroke-width="1.5" filter="url(#stats-design_053-shadow)" />
          
          <!-- Card Header: Icon & Delta Pill -->
          <g transform="translate(24, 24)">
            <rect x="0" y="0" width="46" height="46" rx="12" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="1" />
            
    <g transform="translate(11, 11)" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M21.42 10.922a1 1 0 0 0-.019-.838L12.83 3.18a2 2 0 0 0-1.66 0L2.6 10.084a1 1 0 0 0 0 1.832l8.57 6.908a2 2 0 0 0 1.66 0l6.71-5.409a1 1 0 0 0 .39-.693v-1.8"/>
    <path d="M6 12v5c0 2 3 3 6 3s6-1 6-3v-5"/>
  
      </svg>
    </g>
  
            
            <!-- Delta Pill -->
            <rect x="180" y="6" width="90" height="28" rx="14" fill="#4f46e5" fill-opacity="0.2" stroke="#4f46e5" stroke-width="1" />
            <text x="225" y="24" fill="#4f46e5" font-size="12" font-weight="700" text-anchor="middle" font-family="Inter, sans-serif">
              Across 90 Nations
            </text>
          </g>

          <!-- Big Metric Value -->
          <text x="24" y="145" fill="#0f172a" font-size="48" font-weight="900" font-family="Inter, sans-serif" letter-spacing="-1">
            450K+
          </text>

          <!-- Metric Label -->
          <text x="24" y="185" fill="#2563eb" font-size="18" font-weight="700" font-family="Inter, sans-serif">
            STEM Degrees Awarded
          </text>

          <!-- Divider Line -->
          <line x1="24" y1="210" x2="296" y2="210" stroke="#cbd5e1" stroke-width="1" />

          <!-- Metric Description -->
          
    <text x="24" y="235" fill="#64748b" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="24" dy="0">Accredited credentials certified</tspan><tspan x="24" dy="20">via proctored vector exams</tspan>
    </text>
  

          <!-- Mini Vector Sparkline/Bar Visual -->
          <g transform="translate(24, 290)">
            <rect x="0" y="0" width="40" height="6" rx="3" fill="#2563eb" fill-opacity="0.3" />
            <rect x="50" y="0" width="55" height="6" rx="3" fill="#2563eb" fill-opacity="0.5" />
            <rect x="115" y="0" width="70" height="6" rx="3" fill="#2563eb" fill-opacity="0.7" />
            <rect x="195" y="0" width="80" height="6" rx="3" fill="#4f46e5" />
