            <rect x="0" y="0" width="230" height="220" rx="16" fill="url(#steps-design_014-card-grad)" stroke="#562270" stroke-width="1.5" filter="url(#steps-design_014-shadow)" />
            
            <!-- Icon Wrapper -->
            <rect x="20" y="20" width="44" height="44" rx="10" fill="#f97316" fill-opacity="0.15" />
            
    <g transform="translate(30, 30)" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <svg width="24" height="24" viewBox="0 0 24 24">
        
    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
    <circle cx="9" cy="7" r="4"/>
    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/>
    <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
  
      </svg>
    </g>
  

            <!-- Step Title (Safely bounded) -->
            
    <text x="20" y="95" fill="#ffffff" font-size="18" font-weight="700" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Team Sharing</tspan>
    </text>
  

            <!-- Step Description -->
            
    <text x="20" y="125" fill="#fbcfe8" font-size="13" font-weight="normal" text-anchor="start" font-family="Inter, system-ui, -apple-system, sans-serif" opacity="1">
      <tspan x="20" dy="0">Multiplayer features</tspan><tspan x="20" dy="22">that motivate users to</tspan><tspan x="20" dy="22">invite colleagues.</tspan>
    </text>
  
          </g>
        </g>
      
        <g transform="translate(795, 0)">
          <!-- Circular Node Pin on the connecting line -->
